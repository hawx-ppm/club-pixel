<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BabacasFest</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#10091c;--fg:#f3ecff;--card:#1b1230;--line:#6b4fb0;--accent:#ff3fa4;--onacc:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;font-size:10px;line-height:1.7}
body.ingame{position:fixed;inset:0;width:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:520px;margin:0 auto;padding:max(16px,var(--st)) 16px max(24px,var(--sb))}
h1{font-size:18px;text-align:center;margin:18px 0 8px;color:#ff7ac8;text-shadow:0 0 12px #ff3fa4,0 0 28px #8a5cff}
.sub{text-align:center;opacity:.85;margin:0 0 14px}
.card{background:var(--card);border:3px solid var(--line);padding:16px;border-radius:8px}
input[type=text]{width:100%;font:16px/1.2 system-ui,-apple-system,sans-serif;padding:14px;border:3px solid var(--line);background:#0f0820;color:var(--fg);border-radius:8px;margin-top:8px}
input:disabled{opacity:.4}
button{font:inherit;color:var(--fg);background:#2a1a4a;border:3px solid var(--line);padding:12px 10px;cursor:pointer;border-radius:10px;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button.p{background:var(--accent);color:var(--onacc);border-color:#ffd0ec}
button:disabled{opacity:.35}
.rooms{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.rooms button{padding:20px 6px;font-size:12px}
#msg{display:none;color:#ff9a9a;margin:12px 0 0}
.hide{display:none!important}
#pv{width:180px;height:220px;margin:14px auto 0;border-radius:10px;background:radial-gradient(#3a1a6a,#10091c);overflow:hidden}
.opt{margin-top:12px}.opt b{display:block;margin-bottom:6px;font-size:9px;opacity:.85}
.sws,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #3a2a60}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.chip{padding:9px 10px;font-size:9px;border-radius:16px}
.chip.on{background:var(--accent);border-color:#ffd0ec}
#game{position:fixed;inset:0}
#cvw{position:absolute;inset:0;background:#0b0714;overflow:hidden}
#cvw canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:9px;background:rgba(10,6,20,.7);padding:2px 5px;white-space:nowrap;border-radius:3px}
.bub{position:absolute;left:0;top:0;background:#fff;color:#2b2038;border:2px solid #2b2038;padding:5px 8px;font-size:10px;max-width:200px;text-align:center;display:none;line-height:1.35;word-break:break-word;border-radius:6px}
.fxi{position:absolute;left:0;top:0;font-size:24px;display:none;filter:drop-shadow(0 0 4px #000)}
.fxi.big{font-size:44px;animation:pul .45s infinite alternate}
@keyframes pul{from{scale:1}to{scale:1.3}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) calc(8px + var(--sr)) 8px calc(10px + var(--sl));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#topl{text-shadow:0 1px 4px #000;font-size:9px;min-width:0}
#topl b{font-size:11px}
#tb{display:flex;gap:6px;pointer-events:auto}
.ib{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(20,10,40,.72)}
.ib.sm{width:38px;height:38px;font-size:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b3b;margin-left:6px}
#chatbtn{position:relative}#cdot{position:absolute;right:4px;top:4px;margin:0}
#mini{position:absolute;left:calc(10px + var(--sl));top:calc(86px + var(--st));right:70px;pointer-events:none;font-size:9px}
#mini div{background:rgba(10,6,20,.6);padding:3px 7px;margin-bottom:3px;border-radius:4px;width:fit-content;max-width:100%;word-break:break-word}
#reqs{position:absolute;left:0;right:0;top:calc(76px + var(--st));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;padding:0 10px}
.req{pointer-events:auto;background:rgba(27,18,48,.97);border:3px solid var(--accent);border-radius:10px;padding:10px;max-width:420px;width:100%;font-size:10px}
.req .rb{display:flex;gap:6px;margin-top:8px}.req button{padding:9px 6px;font-size:9px;flex:1}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(200px + var(--sb));background:rgba(10,6,20,.88);padding:8px 12px;border-radius:8px;display:none;z-index:7;max-width:90%;text-align:center;pointer-events:none}
#jk{position:absolute;left:0;right:0;bottom:calc(176px + var(--sb));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#jk button{padding:10px 8px;font-size:9px;background:rgba(20,10,40,.85)}
#joy{position:absolute;left:calc(18px + var(--sl));bottom:calc(22px + var(--sb));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.28);touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:rgba(255,63,164,.6);border:3px solid #ffd0ec;pointer-events:none}
#acts{position:absolute;right:calc(10px + var(--sr));bottom:calc(18px + var(--sb));display:grid;grid-template-columns:repeat(3,54px);gap:8px}
#acts button{width:54px;height:54px;padding:0;font-size:23px;border-radius:50%;background:rgba(20,10,40,.78)}
#rx{position:absolute;right:calc(10px + var(--sr));bottom:calc(196px + var(--sb));display:none;gap:6px;background:rgba(20,10,40,.92);padding:6px;border-radius:30px;z-index:4}
#rx.open{display:flex}
#rx button{width:44px;height:44px;padding:0;font-size:22px;border-radius:50%}
#chat{position:absolute;left:0;right:0;bottom:0;height:min(60vh,460px);background:rgba(16,9,28,.97);border-top:3px solid var(--line);padding:0 10px calc(10px + var(--sb));display:none;flex-direction:column;z-index:5;-webkit-user-select:text;user-select:text}
#chat.open{display:flex}
#chat-resize{height:16px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none;flex-shrink:0}
#chat-resize::after{content:'';width:40px;height:4px;border-radius:2px;background:var(--line)}
#chat-resize:hover::after{background:var(--accent)}
#chat-expand{position:absolute;right:10px;top:2px;width:32px;height:32px;padding:0;font-size:14px;border-radius:8px;z-index:2}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-top:4px}
.tabs{display:flex;gap:6px}.tab{padding:10px 12px;font-size:9px;border-radius:8px}.tab.on{background:var(--accent);border-color:#ffd0ec}
#convs{display:none;gap:6px;overflow-x:auto;padding:4px 0 6px;touch-action:pan-x}#convs.show{display:flex}
#convs .chip,#quick .chip{white-space:nowrap}
#log{flex:1;overflow-y:auto;border:2px solid var(--line);border-radius:6px;padding:8px;background:#0f0820;word-break:break-word;touch-action:pan-y}
#log div{margin-bottom:6px}
#quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;touch-action:pan-x}
.row{display:flex;gap:8px;margin-top:8px}.row input{margin-top:0}
.credit{text-align:center;font-size:8px;opacity:.4;margin-top:16px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
 <div id="menu">
  <h1>BabacasFest</h1>
  <div class="sub" id="sub">Crie seu personagem e entre na festa</div>
  <div class="card">
   <label for="nm">Seu nome</label>

   <div id="pv"></div>
   <div id="opts"></div>
   <div class="rooms" id="rl"></div>
   <p id="msg"></p>
   <p id="until" class="sub" style="margin-top:14px"></p>
   <p class="sub" style="margin:0">Celular: joystick e botões na tela. Computador: setas ou WASD.</p>
   <div class="credit">criado por Hawx</div>
  </div>
 </div>
 <div id="game" class="hide">
  <div id="cvw"><div id="ov"></div></div>
  <div id="top">
   <div id="topl"><b id="rn"></b> <span id="online" style="font-size:9px;opacity:.8;margin-left:6px;display:none">👥 0 online</span><div id="near"></div><div id="mus"></div></div>
   <span id="tb"><button class="ib" id="chatbtn" aria-label="Conversa">🗨️<i id="cdot" class="dot hide"></i></button><button class="ib" id="mute" aria-label="Som">🔇</button><button class="ib" id="out" aria-label="Sair">✖</button></span>
  </div>

  <div id="reqs"></div>
  <div id="toast"></div>
  <div id="jk" class="hide">
   <button data-t="0">Sambabacas - Dance Monster</button>
   <button data-t="1">Sambabacas - Enter the Party</button>
   <button data-t="2">Sambabacas - Electro Sketch</button>

  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="rx"><button data-e="🔥">🔥</button><button data-e="👏">👏</button><button data-e="🎉">🎉</button><button data-e="😂">😂</button><button data-e="❤️">❤️</button></div>
  <div id="acts">
   <button id="dsolo" aria-label="Dançar">🕺</button>
   <button class="nb" data-q="dance" disabled aria-label="Dançar junto">👯</button>
   <button class="nb" data-a="wave" disabled aria-label="Acenar">👋</button>
   <button class="nb" id="talk" disabled aria-label="Conversa privada">💬</button>
   <button class="nb" data-q="hug" disabled aria-label="Abraçar">🤗</button>
   <button class="nb" data-q="kiss" disabled aria-label="Beijar">💋</button>
   <button class="nb" data-a="flirt" disabled aria-label="Flertar">😉</button>
   <button id="rxbtn" aria-label="Reações">😀</button>

   <div id="chat-resize"></div>
   <button id="chat-expand" aria-label="Expandir">⤢</button>
   <div class="chead"><div class="tabs"><button class="tab on" id="tg">Geral<i id="gdot" class="dot hide"></i></button><button class="tab" id="tp">Privado<i id="pdot" class="dot hide"></i></button></div><button class="ib sm" id="cclose" aria-label="Fechar">✖</button></div>
   <div id="convs"></div>
   <div id="log"></div>
   <div id="quick"></div>
   <div class="row"><input id="say" type="text" maxlength="80" placeholder="Mensagem para todos" autocomplete="off" enterkeyhint="send"><button class="p" id="send">Enviar</button></div>
  </div>
 </div>
</div>
<script>
// ======================= CONFIGURAÇÃO =======================
const HIVEMQ={
  host:'i262bdb3.ala.eu-central-1.emqxsl.com', // O Connection Address do EMQX (sem wss:// e sem porta)
  user:'hawx',       // O usuário que você criou
  pass:'*Cabritoneon17#'          // A senha que você definiu
};
const PARTY={open:'',close:''};
const NS='cp3-babacasfest-v3';
// ==========================================================================
const $=id=>document.getElementById(id);
const ROOMS=[
 {id:'babacas',name:'BabacasFest',e:'🎉',p:[0xff2d95,0x22d3ee,0x8a5cff]}
];
const WX=32,WZ=24;
const r2=v=>Math.round(v*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tOpen=PARTY.open?new Date(PARTY.open).getTime():0,tClose=PARTY.close?new Date(PARTY.close).getTime():Infinity;
const phase=()=>{const n=Date.now();return n<tOpen?'before':(n>tClose?'after':'open')};
const SKIN=[0xf6d3b3,0xf0c09a,0xd9a27a,0xb97a52,0x8a5a3a,0x5a3a28];
const HAIRC=[0x2b1b10,0x6b3f1d,0xd9b13a,0xb33a2a,0x111111,0xeeeeee,0x3a8fe0,0xe03a9a];
const SHIRTC=[0xd94f4f,0x4f7fd9,0xe0b43a,0x8a56c8,0x3aa77a,0xe07a3a,0xd95fa0,0x4a4a5a,0xf2f2f2,0x1fd1c4];
const PANTSC=[0x3a2f55,0x222222,0x3a5a8a,0x6a4a2a,0x8a2a3a,0xdddddd];
const HEX=c=>'#'+c.toString(16).padStart(6,'0');
const SHCSS=i=>HEX(SHIRTC[(i|0)%10]);

// ======================= MÚSICAS ONLINE =======================
const SONGS=[
 {n:'Sambabacas - Dance Monster',url:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2003%20-%20Dance%20Monster.mp3',dur:180},
 {n:'Sambabacas - Enter the Party',url:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2006%20-%20Enter%20the%20Party.mp3',dur:180},
 {n:'Sambabacas - Electro Sketch',url:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2005%20-%20Electro%20%28Sketch%29.mp3',dur:150},
 {n:'Sambabacas - Son of a Rocket',url:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2017%20-%20Son%20of%20a%20Rocket.mp3',dur:210}
];

// ======================= Rede (MQTT) — tópico único =======================
async function connectNet(room,H){
 const id=Math.random().toString(36).slice(2,12),base=NS+'/'+room+'/';
 const brokers=HIVEMQ.host?[{url:'wss://'+HIVEMQ.host+':8884/mqtt',username:HIVEMQ.user,password:HIVEMQ.pass}]:[{url:'wss://broker.hivemq.com:8884/mqtt'},{url:'wss://broker.emqx.io:8084/mqtt'}];
 let client=null;
 for(const b of brokers){
  try{client=await new Promise((res,rej)=>{
   const o={clientId:'cp_'+id,keepalive:30,reconnectPeriod:1500,connectTimeout:6000,clean:true};if(b.username){o.username=b.username;o.password=b.password}
   const c=mqtt.connect(b.url,o);const to=setTimeout(()=>{c.removeAllListeners();c.end(true);rej(new Error('timeout'))},8000);
   const ok=()=>{clearTimeout(to);c.removeListener('error',bad);res(c)},bad=e=>{clearTimeout(to);c.removeAllListeners();c.end(true);rej(e)};
   c.once('connect',ok);c.once('error',bad)});break}catch(e){client=null}}
 if(!client){const e=new Error('sem conexao');e.code='SEM_CONEXAO';throw e}
 let wasOn=true;
 const send=(t,m,o)=>{if(client.connected)client.publish(t,m,o||{qos:0})};
 const sub=()=>{client.subscribe([base+'p',base+'g',base+'m',base+'d/'+id,base+'on'])};
 client.on('error',()=>{});
 client.on('close',()=>{if(wasOn&&H.disc)H.disc()});
 client.on('connect',sub);
 client.on('message',(tp,pl)=>{
  if(tp===base+'p'){let q;try{q=JSON.parse(pl.toString())}catch(e){return}
    if(q.id===id)return;
    H.state(q.id,'all',q);
  }
  else if(tp===base+'g'){try{H.global(JSON.parse(pl.toString()))}catch(e){}}
  else if(tp===base+'d/'+id){try{H.dm(JSON.parse(pl.toString()))}catch(e){}}
  else if(tp===base+'m'){const s=pl.toString();try{H.music(s?JSON.parse(s):null)}catch(e){}}
  else if(tp===base+'on'){try{H.online(JSON.parse(pl.toString()))}catch(e){}}});
 sub();
 return {
  id:id,
  setCell(){return false},
  has:()=>true,
  pub(q){q.id=id;send(base+'p',JSON.stringify(q))},
  ping(){send(base+'on',JSON.stringify({id:id,t:Date.now()}))},
  global:m=>send(base+'g',JSON.stringify(m)),
  dm:(to,m)=>send(base+'d/'+to,JSON.stringify(m),{qos:1}),
  music:m=>send(base+'m',m?JSON.stringify(m):'',{qos:1,retain:true}),
  leave(){wasOn=false;send(base+'p',JSON.stringify({id:id,g:1}));const c=client;setTimeout(()=>{try{c.end(true)}catch(e){}},400)}
 }}

// ======================= Música =======================
let AC=null,mute=true,cur=-1,seqT=0,stp=0,nextT=0,audioEl=null,musicLockUntil=0,musicBy='';
function playBeat(){
 if(!AC||mute)return;
 const t=AC.currentTime;
 const o=AC.createOscillator(),g=AC.createGain();
 o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.1);
 g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.15);
 const n=AC.createBufferSource();const buf=AC.createBuffer(1,1024,AC.sampleRate);
 const d=buf.getChannelData(0);for(let i=0;i<1024;i++)d[i]=Math.random()*2-1;
 n.buffer=buf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
 const g2=AC.createGain();g2.gain.setValueAtTime(0.06,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.05);
 n.connect(f);f.connect(g2);g2.connect(AC.destination);n.start(t);n.stop(t+0.05);
}
function startBeatLoop(){stopSeq();if(!AC||mute)return;nextT=AC.currentTime+0.05;seqT=setInterval(()=>{if(!AC||mute||cur>=0)return;playBeat()},500)}
function stopSeq(){clearInterval(seqT);seqT=0}
function stopAudio(){if(audioEl){audioEl.pause();audioEl.src='';audioEl=null}}
function playSong(i){
 stopBeat();stopAudio();
 if(i<0||!SONGS[i]||!AC){cur=-1;if(!mute)startBeatLoop();setMusText();return}
 cur=i;
 if(!mute){
  audioEl=new Audio(SONGS[i].url);
  audioEl.volume=0.7;
  audioEl.onended=()=>{cur=-1;musicLockUntil=0;musicBy='';if(!mute)startBeatLoop();setMusText();net&&net.music(null)};
  audioEl.play().catch(()=>{});
 }
 setMusText();
}
function stopBeat(){stopSeq()}
function setMusText(){const e=$('mus');if(cur>=0&&SONGS[cur]){e.textContent='♪ '+SONGS[cur].n+' ('+musicBy+')'}else{e.textContent='♪ Batida padrão'}}
function onMusic(m){
 if(!m){if(cur>=0){stopAudio();cur=-1}musicLockUntil=0;musicBy='';if(!mute)startBeatLoop();setMusText();return}
 if(m.tr>=0&&SONGS[m.tr]&&Date.now()<m.lockUntil){
  musicLockUntil=m.lockUntil;musicBy=String(m.by||'').slice(0,12);
  if(cur!==m.tr){playSong(m.tr)}
  setMusText();
 }else if(Date.now()>=m.lockUntil){musicLockUntil=0;musicBy='';if(cur>=0){stopAudio();cur=-1}if(!mute)startBeatLoop();setMusText()}
}

// ======================= Personagens =======================
const VM=new THREE.MeshLambertMaterial({vertexColors:true});
const SHM=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.4});
let SHG=null;
function bx(w,h,d,x,y,z,c){const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);const n=g.attributes.position.count,col=new Float32Array(n*3),cc=new THREE.Color(c);
 for(let i=0;i<n;i++){col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b}g.setAttribute('color',new THREE.BufferAttribute(col,3));return g}
function mergeG(gs){let n=0,ni=0;gs.forEach(g=>{n+=g.attributes.position.count;ni+=g.index.count});
 const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3),I=new Uint16Array(ni);let o=0,oi=0;
 gs.forEach(g=>{const ix=g.index.array;P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);for(let i=0;i<ix.length;i++)I[oi+i]=ix[i]+o;o+=g.attributes.position.count;oi+=ix.length;g.dispose()});
 const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P,3));m.setAttribute('normal',new THREE.BufferAttribute(N,3));m.setAttribute('color',new THREE.BufferAttribute(C,3));m.setIndex(new THREE.BufferAttribute(I,1));return m}
function piv(par,x,y,z,geo){const g=new THREE.Group();g.position.set(x,y,z);g.add(new THREE.Mesh(geo,VM));par.add(g);return g}
function mkChar(L){
 const sk=SKIN[L[0]%6],hs=L[1]%5,hc=HAIRC[L[2]%8],sc=SHIRTC[L[3]%10],pc=PANTSC[L[4]%6],st=L[5]%2;

 else if(m.t==='rej'){delete pending[m.f+m.act];toast(fn+' recusou 🙅')}}

// ---- chat
const chatOpen=()=>$('chat').classList.contains('open');
function convo(id,name){return convos[id]||(convos[id]={name:name,msgs:[],unread:0})}
function mini(text,color){const m=$('mini'),d=document.createElement('div');d.textContent=text;if(color)d.style.color=color;m.appendChild(d);while(m.children.length>5)m.firstChild.remove();setTimeout(()=>d.remove(),12000)}
function addG(text,color,own){glog.push({t:text,c:color});if(glog.length>100)glog.shift();
 if(!own&&!(chatOpen()&&tab==='g'))gUnread=true;if(chatOpen()&&tab==='g')renderChat();setDots();mini(text,color)}
function setDots(){const pu=Object.values(convos).some(c=>c.unread>0),op=chatOpen();
 $('pdot').classList.toggle('hide',!pu||(op&&tab==='p'));$('gdot').classList.toggle('hide',!gUnread||(op&&tab==='g'));$('cdot').classList.toggle('hide',op||!(pu||gUnread))}
function showTab(t){tab=t;$('tg').classList.toggle('on',t==='g');$('tp').classList.toggle('on',t==='p');
 if(t==='g')gUnread=false;else if(activeC&&convos[activeC])convos[activeC].unread=0;renderChat();setDots()}
function renderChat(){
 const L=$('log');L.textContent='';
 const c=activeC&&convos[activeC];
 const lines=tab==='g'?glog:(c?c.msgs.map(m=>({t:(m.me?'Você: ':c.name+': ')+m.t,c:m.me?'#9ad':'#fff'})):[]);
 lines.forEach(l=>{const d=document.createElement('div');d.textContent=l.t;if(l.c)d.style.color=l.c;L.appendChild(d)});
 const cv=$('convs');cv.classList.toggle('show',tab==='p');cv.textContent='';
 if(tab==='p'){Object.keys(convos).forEach(id=>{const k=convos[id],b=document.createElement('button');b.className='chip'+(id===activeC?' on':'');b.textContent=k.name+(k.unread?' •':'');b.onclick=()=>{activeC=id;k.unread=0;renderChat();setDots()};cv.appendChild(b)});
  if(c){const bb=document.createElement('button');bb.className='chip';bb.textContent='🚫 Bloquear';bb.onclick=()=>blockUser(activeC);cv.appendChild(bb)}
  if(!Object.keys(convos).length){const d=document.createElement('div');d.style.opacity='.8';d.textContent='Chegue perto de alguém e toque em 💬 para conversar em particular.';L.appendChild(d)}}
 L.scrollTop=L.scrollHeight;
 $('say').placeholder=tab==='g'?'Mensagem para todos':(c?'Mensagem privada para '+c.name:'Escolha uma conversa');
 $('say').disabled=tab==='p'&&!c}
function sendText(t){t=String(t).trim().slice(0,80);if(!t||!net)return;
 if(tab==='g'){net.global({f:myId,n:myName,c:look[3],t:t});mine.say=t;mine.sa=Date.now();mine.tSay=Date.now();force=true;addG('Você: '+t,'#9ad',true)}
 else if(activeC&&convos[activeC]){net.dm(activeC,{t:'chat',f:myId,fn:myName,x:t});convos[activeC].msgs.push({me:1,t:t});renderChat()}}
function openPrivate(id){const e=R[id];convo(id,e?String(e.q.n||'?').slice(0,12):'?');activeC=id;$('chat').classList.add('open');showTab('p')}
function blockUser(id){const n=convos[id]?convos[id].name:'';blockedIds[id]=true;delete R[id];delete convos[id];if(activeC===id)activeC=null;renderChat();setDots();toast('🚫 Bloqueado'+(n?': '+n:''))}
$('chatbtn').onclick=()=>{$('chat').classList.toggle('open');if(!chatOpen())$('say').blur();else showTab(tab);setDots()};
$('cclose').onclick=()=>{$('chat').classList.remove('open');$('say').blur();setDots()};
$('tg').onclick=()=>showTab('g');$('tp').onclick=()=>showTab('p');
$('send').onclick=()=>{sendText($('say').value);$('say').value=''};
$('say').addEventListener('keydown',e=>{if(e.key==='Enter'){sendText($('say').value);$('say').value=''}});
QUICK.forEach(q=>{const b=document.createElement('button');b.className='chip';b.textContent=q;b.onclick=()=>sendText(q);$('quick').appendChild(b)});
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none'},2600)}

// ---- chat redimensionável
(function(){
 const chat=$('chat'),handle=$('chat-resize');
 let startY=0,startH=0,resizing=false;
 function setH(h){h=clamp(h,120,window.innerHeight-80);chat.style.height=h+'px';try{localStorage.setItem('cp_chatH',h)}catch(e){}}
 try{const saved=+localStorage.getItem('cp_chatH');if(saved>0)setH(saved)}catch(e){}
 handle.addEventListener('pointerdown',e=>{resizing=true;startY=e.clientY;startH=chat.getBoundingClientRect().height;handle.setPointerCapture(e.pointerId);e.preventDefault()});
 handle.addEventListener('pointermove',e=>{if(!resizing)return;setH(startH+(startY-e.clientY));e.preventDefault()});
 ['pointerup','pointercancel'].forEach(ev=>handle.addEventListener(ev,e=>{resizing=false}));
 $('chat-expand').onclick=()=>{const cur=chat.getBoundingClientRect().height;setH(cur>window.innerHeight*0.7?Math.min(460,window.innerHeight*0.6):window.innerHeight-100)};
})();

// ---- pedidos
function sendReq(act){const e=nearE;if(!e||!net)return toast('Chegue perto de alguém');const key=e.id+act;if(pending[key])return toast('Pedido já enviado ⏳');
 net.dm(e.id,{t:'req',act:act,f:myId,fn:myName});toast('Pedido enviado para '+String(e.q.n||'?').slice(0,12)+' ⏳');pending[key]=setTimeout(()=>{delete pending[key]},20000)}
function showReq(m,fn){const key=m.f+m.act;if(document.querySelector('[data-rq="'+key+'"]'))return;
 const d=document.createElement('div');d.className='req';d.dataset.rq=key;
 const t=document.createElement('div');t.textContent=fn+' '+RQ[m.act];d.appendChild(t);
 const rb=document.createElement('div');rb.className='rb';
 [['Aceitar',()=>answerReq(m,true,d),'p'],['Recusar',()=>answerReq(m,false,d),''],['🚫',()=>{d.remove();blockUser(m.f)},'']].forEach(x=>{const b=document.createElement('button');b.textContent=x[0];if(x[2])b.className=x[2];b.onclick=x[1];rb.appendChild(b)});
 d.appendChild(rb);$('reqs').appendChild(d);setTimeout(()=>d.remove(),20000)}
function answerReq(m,ok,el){el.remove();if(!net)return;const e=R[m.f];
 if(ok&&(!e||Math.hypot(e.sx-me.x,e.sy-me.y)>6)){toast('Essa pessoa está longe');ok=false}
 net.dm(m.f,{t:ok?'acc':'rej',act:m.act,f:myId,fn:myName});if(ok)toast('Você aceitou ✔')}
function onAcc(m,fn){const key=m.f+m.act;if(!pending[key])return;clearTimeout(pending[key]);delete pending[key];
 const e=R[m.f];if(!e||Math.hypot(e.sx-me.x,e.sy-me.y)>6){toast('Muito longe agora 😕');return}
 const n=Date.now();if(m.act==='dance'){mine.dn=n;mine.dto=m.f;mine.tDn=n}else{mine.act=m.act;mine.at=n;mine.to=m.f;mine.em=null;mine.tAct=n}
 force=true;mini(fn+' aceitou! 💞')}

// ---- ações
$('dsolo').onclick=()=>{mine.dn=Date.now();mine.dto=null;mine.tDn=Date.now();force=true};
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{
 if(!nearE)return toast('Chegue perto de alguém');
 if(b.dataset.a){const n=Date.now();mine.act=b.dataset.a;mine.at=n;mine.tAct=n;mine.to=nearE.id;mine.em=null;force=true}
 else if(b.dataset.q)sendReq(b.dataset.q);else if(b.id==='talk')openPrivate(nearE.id)});
$('rxbtn').onclick=()=>$('rx').classList.toggle('open');
document.querySelectorAll('#rx button').forEach(b=>b.onclick=()=>{const n=Date.now();mine.act='rx';mine.em=b.dataset.e;mine.at=n;mine.tAct=n;mine.to=null;force=true;$('rx').classList.remove('open')});
$('drinkbtn').onclick=()=>{
 const d=DRINKS[Math.floor(Math.random()*DRINKS.length)];
 mine.drink={n:d.n,c:d.c};mine.tDrink=Date.now();force=true;
 toast('Você pegou '+d.n+' 🍹');
 setTimeout(()=>{if(mine.drink){mine.drink=null;force=true}},8000);
};
document.querySelectorAll('#jk button').forEach(b=>b.onclick=()=>{
 if(!net)return;const t=+b.dataset.t;
 if(t>=0&&musicLockUntil>Date.now())return toast('🔒 Música tocando. Aguarde terminar.');
 if(t>=0&&SONGS[t]){const lock=Date.now()+SONGS[t].dur*1000;net.music({tr:t,by:myName,lockUntil:lock});onMusic({tr:t,by:myName,lockUntil:lock})}
 else{net.music(null);onMusic(null)}
});
$('mute').onclick=()=>{
 mute=!mute;$('mute').textContent=mute?'🔇':'🔊';
 if(AC)AC.resume();
 if(!mute){if(cur>=0&&SONGS[cur]){if(audioEl)audioEl.play().catch(()=>{});else playSong(cur)}else startBeatLoop()}
 else{stopSeq();if(audioEl)audioEl.pause()}
};

// ---- controles
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;const k=KM[e.key];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
function joyMove(e){const r=$('joy').getBoundingClientRect();let dx=(e.clientX-(r.left+r.width/2))/(r.width/2),dy=(e.clientY-(r.top+r.height/2))/(r.height/2);const m=Math.hypot(dx,dy);
 if(m>1){dx/=m;dy/=m}$('knob').style.transform='translate('+(dx*38).toFixed(1)+'px,'+(dy*38).toFixed(1)+'px)';if(m<.22){joy.x=0;joy.y=0}else{joy.x=dx;joy.y=dy}}
function joyEnd(){joyId=null;joy.x=0;joy.y=0;$('knob').style.transform=''}
$('joy').addEventListener('pointerdown',e=>{joyId=e.pointerId;try{$('joy').setPointerCapture(e.pointerId)}catch(x){}joyMove(e);e.preventDefault()});
$('joy').addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e);e.preventDefault()}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('joy').addEventListener(ev,e=>{if(e.pointerId===joyId)joyEnd()}));
if(window.visualViewport){const f=()=>{const vv=window.visualViewport;$('chat').style.bottom=Math.max(0,window.innerHeight-vv.height-vv.offsetTop)+'px'};visualViewport.addEventListener('resize',f);visualViewport.addEventListener('scroll',f)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&GL&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{GL.wl=l}).catch(()=>{})});

// ---- 3D
function startGL(r){
 let ren;const small=Math.min(innerWidth,innerHeight)<700;
 try{ren=new THREE.WebGLRenderer({antialias:!small,powerPreference:'high-performance'})}catch(e){return false}
 ren.setPixelRatio(Math.min(window.devicePixelRatio||1,small?1.5:2));ren.domElement.addEventListener('webglcontextlost',e=>e.preventDefault());
 $('cvw').insertBefore(ren.domElement,$('ov'));
 const W=buildWorld(r),cam=new THREE.PerspectiveCamera(42,1.4,.1,220);
 GL={ren:ren,cam:cam,W:W,sc:W.sc,ents:{},w:0,h:0,v:new THREE.Vector3(),cx:me.x,cz:me.y,cf:1,lz:0};resizeGL();return true}
function resizeGL(){if(!GL)return;const el=$('cvw'),w=el.clientWidth||320,h=el.clientHeight||480;GL.ren.setSize(w,h,false);GL.cam.aspect=w/h;
 GL.cf=Math.min(2.7,Math.max(1,1.4/(w/h)*.96));GL.lz=Math.min(2.4,(GL.cf-1)*1.4);GL.cam.updateProjectionMatrix();GL.w=w;GL.h=h}
addEventListener('resize',resizeGL);
function mkdiv(c){const d=document.createElement('div');d.className=c;$('ov').appendChild(d);return d}
function dropEnt(o){GL.sc.remove(o.g);disposeChar(o);o.tag.remove();o.bub.remove();o.fx.remove()}
function stopGL(){if(!GL)return;if(GL.wl){try{GL.wl.release()}catch(e){}}for(const id in GL.ents)dropEnt(GL.ents[id]);GL.ren.dispose();GL.ren.domElement.remove();GL=null}
function scr(x,y,z){GL.v.set(x,y,z).project(GL.cam);return [(GL.v.x*.5+.5)*GL.w,(-GL.v.y*.5+.5)*GL.h]}
const put=(el,p,tr)=>{el.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px) translate('+tr+')'};
function buildState(slim){if(slim)return {x:r2(me.x),y:r2(me.y),d:r2(me.d),s:me.s};const n=Date.now(),q={n:myName,L:look,x:r2(me.x),y:r2(me.y),d:r2(me.d),s:me.s};
 if(mine.dn&&n-mine.tDn<8500){q.dn=mine.dn;if(mine.dto)q.dto=mine.dto}
 if(mine.at&&n-mine.tAct<4500){q.act=mine.act;q.at=mine.at;if(mine.to)q.to=mine.to;if(mine.em)q.em=mine.em}
 if(mine.sa&&n-mine.tSay<7000){q.say=mine.say;q.sa=mine.sa}
 if(mine.drink&&n-mine.tDrink<8000){q.drink=mine.drink.n}
 return q}
function loop(now){
 raf=requestAnimationFrame(loop);if(!GL||!net)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=Date.now(),k=t/1000;
 if(phase()==='after'){leaveGame('A boate fechou. Obrigado por vir! 🌙');return}
 const ix=((keys.right?1:0)-(keys.left?1:0))||joy.x,iy=((keys.down?1:0)-(keys.up?1:0))||joy.y,mv=ix||iy;
 if(mv){const m=Math.hypot(ix,iy),sp=4.5*dt*Math.min(1,m),dx=ix/m*sp,dz=iy/m*sp;if(!blocked(me.x+dx,me.y))me.x+=dx;if(!blocked(me.x,me.y+dz))me.y+=dz;me.d=Math.atan2(ix,iy)}
 me.s=mv?1:0;me.h+=(elevAt(me.x,me.y)-me.h)*.25;
 const key=r2(me.x)+','+r2(me.y)+','+r2(me.d)+','+me.s,dp=t-lastPub;
 if((force&&dp>120)||(key!==lastKey&&dp>(me.s?220:900))||dp>2000){
   const full=force||dp>2000||t-lastFull>2000;
   net.pub(buildState(!full));lastPub=t;lastKey=key;force=false;if(full)lastFull=t
 }
 for(const id in R)if(t-R[id].seen>15000)delete R[id];
 const arr=[];for(const id in R){const e=R[id];e.sx+=(e.q.x-e.sx)*.3;e.sy+=(e.q.y-e.sy)*.3;e.dist=Math.hypot(e.sx-me.x,e.sy-me.y);arr.push(e)}
 arr.sort((a,b)=>a.dist-b.dist);
 const list=arr.slice(0,45).map(e=>({id:e.id,x:e.sx,y:e.sy,q:e.q,name:String(e.q.n||'?').slice(0,12),tAct:e.tAct||0,tDn:e.tDn||0,tSay:e.tSay||0,tDrink:e.tDrink||0,dist:e.dist,mv:e.q.s}));
 const E={me:1,id:myId,x:me.x,y:me.y,q:buildState(),name:myName,tAct:mine.tAct,tDn:mine.tDn,tSay:mine.tSay,tDrink:mine.tDrink,dist:0,mv:me.s};
 list.push(E);const by={};list.forEach(e=>{by[e.id]=e});
 const effs=[];
 for(const e of list){const q=e.q;
  if(q.dn&&t-e.tDn<8000){e.dn=1;const o=by[q.dto];if(o){o.dn=1;e.fc=e.fc||o;o.fc=o.fc||e}}
  if(q.at&&t-e.tAct<3500){const age=(t-e.tAct)/3500,o=q.to&&by[q.to];
   if(o&&(q.act==='kiss'||q.act==='hug')){e.fc=o;o.fc=o.fc||e;effs.push({e:e,o:o,a:q.act,age:age})}
   else{if(o){e.fc=o;o.fc=o.fc||e}effs.push({e:e,o:null,a:q.act,age:age,em:q.em})}}}
 for(const f of effs){const a=f.age,e=f.e;
  if(f.o){const mid=[(e.x+f.o.x)/2,2.9+a*.6,(e.y+f.o.y)/2];
   if(f.a==='kiss'){e.fxT='💋';e.fxP=[e.x,2.5+a*.5,e.y];f.o.fxT='❤️';f.o.fxP=mid;f.o.big=1}
   else{e.fxT='🤗';e.fxP=[e.x,2.5+a*.5,e.y];f.o.fxT='🤗';f.o.fxP=[f.o.x,2.5+a*.5,f.o.y]}
   f.o.fxA=a}
  else{e.fxT=f.a==='rx'?String(f.em||'✨').slice(0,4):(EMO[f.a]||'✨');e.fxP=[e.x,2.5+a*.5,e.y]}
  e.fxA=a}
 for(const e of list){if(e.q.drink&&t-e.tDrink<8000){e.fxT='🍹';e.fxP=[e.x,2.8,e.y];e.fxA=0}}
 let best=null,bd=2.5;for(const e of list){if(!e.me&&e.dist<bd){bd=e.dist;best=e}}
 nearE=best;
 if(!!best!==lastNearOn){lastNearOn=!!best;document.querySelectorAll('.nb').forEach(b=>{b.disabled=!best})}
 $('near').textContent=best?'💞 Perto de '+best.name:'Chegue perto de alguém para interagir';
 const nearBar=(me.x>22&&me.x<26&&me.y>1&&me.y<13);
 $('drinkbtn').style.display=nearBar?'block':'none';
 const nj=(me.x>-10&&me.x<10&&me.y>-20.5&&me.y<-15.5);
 if(nj!==lastJk){lastJk=nj;$('jk').classList.toggle('hide',!nj)}
 const tx=clamp(me.x,-24,24),tz=clamp(me.y,-18,18);GL.cx+=(tx-GL.cx)*.12;GL.cz+=(tz-GL.cz)*.12;
 GL.cam.position.set(GL.cx,11.5*GL.cf,GL.cz+10.5*GL.cf);GL.cam.lookAt(GL.cx,.5,GL.cz+GL.lz);GL.cam.updateMatrixWorld();
 const bpm=cur>=0?120:0,ph=bpm?((k*bpm/60)%1):0,pulse=bpm?Math.pow(1-ph,3):0;animWorld(GL.W,k,bpm,pulse,t);
 const alive={};
 for(const e of list){const id=e.id;alive[id]=1;let o=GL.ents[id];
  if(!o){const L=(Array.isArray(e.q.L)&&e.q.L.length===6)?e.q.L.map(v=>v|0):look;o=mkChar(L);o.tag=mkdiv('tag');o.bub=mkdiv('bub');o.fx=mkdiv('fxi');o.h=0;GL.sc.add(o.g);GL.ents[id]=o;o.tag.textContent=e.name;o.tag.style.color=SHCSS(L[3])}
  const tgt=e.fc?Math.atan2(e.fc.x-e.x,e.fc.y-e.y):(e.q.d||0);let df=tgt-o.ry;df=Math.atan2(Math.sin(df),Math.cos(df));o.ry+=df*.25;o.g.rotation.y=o.ry;
  o.h+=(elevAt(e.x,e.y)-o.h)*.25;const w=k*10;
  if(e.dn){const s=k*7;o.g.position.set(e.x,o.h+Math.abs(Math.sin(s))*.18,e.y);o.armL.rotation.x=-2.5+Math.sin(s)*.6;o.armR.rotation.x=-2.5-Math.sin(s)*.6;o.armL.rotation.z=-.25;o.armR.rotation.z=.25;
   o.legL.rotation.x=Math.sin(s)*.5;o.legR.rotation.x=-Math.sin(s)*.5;o.body.rotation.y=Math.sin(k*3.5)*.45;o.head.rotation.z=Math.sin(k*3.5)*.2}
  else{o.g.position.set(e.x,o.h,e.y);const a=e.mv?Math.sin(w)*.8:0;o.armL.rotation.x+=((-a)-o.armL.rotation.x)*.3;o.armR.rotation.x+=(a-o.armR.rotation.x)*.3;o.armL.rotation.z*=.7;o.armR.rotation.z*=.7;
   o.legL.rotation.x+=(a-o.legL.rotation.x)*.3;o.legR.rotation.x+=((-a)-o.legR.rotation.x)*.3;o.body.rotation.y*=.7;o.head.rotation.z*=.7}
  const far=e.dist>20;
  if(far){o.tag.style.display='none';o.bub.style.display='none';o.fx.style.display='none';continue}
  o.tag.style.display='block';put(o.tag,scr(e.x,o.h,e.y+.2),'-50%,4px');
  if(e.q.sa&&t-e.tSay<6000){const sy=String(e.q.say||'').slice(0,80);if(o.bt!==sy){o.bt=sy;o.bub.textContent=sy}o.bub.style.display='block';put(o.bub,scr(e.x,o.h+2.3,e.y),'-50%,-100%')}else o.bub.style.display='none';
  let ft=e.fxT,fp=e.fxP;if(!ft&&e.dn){ft='🎶';fp=[e.x,o.h+2.5+Math.abs(Math.sin(k*4))*.2,e.y]}
  if(ft){if(o.ft!==ft){o.ft=ft;o.fx.textContent=ft}o.fx.className=e.big?'fxi big':'fxi';o.fx.style.display='block';o.fx.style.opacity=e.fxA>.75?Math.max(0,1-(e.fxA-.75)*4):1;put(o.fx,scr(fp[0],fp[1]+o.h,fp[2]),'-50%,-100%')}else o.fx.style.display='none'}
 for(const id in GL.ents)if(!alive[id]){dropEnt(GL.ents[id]);delete GL.ents[id]}
 GL.ren.render(GL.sc,GL.cam)}
