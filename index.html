<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>
:root{--bg:#10091c;--fg:#f3ecff;--card:#1b1230;--line:#6b4fb0;--accent:#ff3fa4;--onacc:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;font-size:10px;line-height:1.7}
body.ingame{position:fixed;inset:0;width:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:520px;margin:0 auto;padding:max(16px,var(--st)) 16px max(16px,var(--sb))}
h1{font-size:18px;text-align:center;margin:18px 0 8px;color:#ff7ac8;text-shadow:0 0 12px #ff3fa4,0 0 28px #8a5cff}
.sub{text-align:center;opacity:.85;margin:0 0 14px}
.card{background:var(--card);border:3px solid var(--line);padding:16px;border-radius:8px}
input[type=text]{width:100%;font:16px/1.2 system-ui,-apple-system,sans-serif;padding:14px;border:3px solid var(--line);background:#0f0820;color:var(--fg);border-radius:8px;margin-top:8px}
button{font:inherit;color:var(--fg);background:#2a1a4a;border:3px solid var(--line);padding:12px 10px;cursor:pointer;border-radius:10px;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button.p{background:var(--accent);color:var(--onacc);border-color:#ffd0ec}
button:disabled{opacity:.35}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.rooms button{padding:20px 6px;font-size:10px}
#msg{display:none;color:#ff9a9a;margin:12px 0 0}
.hide{display:none!important}
#game{position:fixed;inset:0}
#cvw{position:absolute;inset:0;background:#0b0714;overflow:hidden}
#cvw canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:9px;background:rgba(10,6,20,.7);padding:2px 5px;white-space:nowrap;border-radius:3px}
.bub{position:absolute;left:0;top:0;background:#fff;color:#2b2038;border:2px solid #2b2038;padding:5px 8px;font-size:10px;max-width:200px;text-align:center;display:none;line-height:1.35;word-break:break-word;border-radius:6px}
.fxi{position:absolute;left:0;top:0;font-size:24px;display:none;filter:drop-shadow(0 0 4px #000)}
.fxi.big{font-size:44px;animation:pul .45s infinite alternate}
@keyframes pul{from{scale:1}to{scale:1.3}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) calc(8px + var(--sr)) 8px calc(10px + var(--sl));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#topl{text-shadow:0 1px 4px #000;font-size:9px;min-width:0}
#topl b{font-size:11px}
#tb{display:flex;gap:6px;pointer-events:auto}
.ib{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(20,10,40,.72)}
.ib.sm{width:38px;height:38px;font-size:16px}
#mini{position:absolute;left:calc(10px + var(--sl));top:calc(86px + var(--st));right:70px;pointer-events:none;font-size:9px}
#mini div{background:rgba(10,6,20,.6);padding:3px 7px;margin-bottom:3px;border-radius:4px;width:fit-content;max-width:100%;word-break:break-word}
#jk{position:absolute;left:0;right:0;bottom:calc(172px + var(--sb));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#jk button{padding:10px 8px;font-size:9px;background:rgba(20,10,40,.85)}
#joy{position:absolute;left:calc(18px + var(--sl));bottom:calc(22px + var(--sb));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.28);touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:rgba(255,63,164,.6);border:3px solid #ffd0ec;pointer-events:none}
#acts{position:absolute;right:calc(10px + var(--sr));bottom:calc(18px + var(--sb));display:grid;grid-template-columns:repeat(3,54px);gap:8px}
#acts button{width:54px;height:54px;padding:0;font-size:23px;border-radius:50%;background:rgba(20,10,40,.78)}
#chat{position:absolute;left:0;right:0;bottom:0;height:min(55vh,420px);background:rgba(16,9,28,.96);border-top:3px solid var(--line);padding:10px 10px calc(10px + var(--sb));display:none;flex-direction:column;z-index:5;-webkit-user-select:text;user-select:text}
#chat.open{display:flex}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#log{flex:1;overflow-y:auto;border:2px solid var(--line);border-radius:6px;padding:8px;background:#0f0820;word-break:break-word;touch-action:pan-y}
#log div{margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:8px}
.row input{margin-top:0}
</style>
</head>
<body>
<div id="app">
 <div id="menu">
  <h1>Club Pixel 3D</h1>
  <div class="sub">Digite seu nome e escolha uma pista</div>
  <div class="card">
   <label for="nm">Seu nome</label>
   <input id="nm" type="text" maxlength="12" placeholder="ex.: Ana" autocomplete="off">
   <div class="rooms" id="rl"></div>
   <p id="msg"></p>
   <p id="until" class="sub" style="margin-top:14px"></p>
   <p class="sub" style="margin:0">Celular: joystick e botões na tela. Computador: setas ou WASD.</p>
  </div>
 </div>
 <div id="game" class="hide">
  <div id="cvw"><div id="ov"></div></div>
  <div id="top">
   <div id="topl"><b id="rn"></b><div id="near"></div><div id="mus"></div></div>
   <span id="tb"><button class="ib" id="chatbtn" aria-label="Conversa">🗨️</button><button class="ib" id="mute" aria-label="Som">🔊</button><button class="ib" id="out" aria-label="Sair">✖</button></span>
  </div>
  <div id="mini"></div>
  <div id="jk" class="hide">
   <button data-t="0">🎹 Chiptune</button><button data-t="1">🥁 Samba</button><button data-t="2">☕ Lo-fi</button><button data-t="3">🪩 Disco</button><button data-t="-1">⏹ Parar</button>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="acts">
   <button id="dsolo" title="Dançar" aria-label="Dançar">🕺</button>
   <button class="nb" data-d="1" disabled title="Dançar junto" aria-label="Dançar junto">👯</button>
   <button class="nb" data-a="wave" disabled title="Acenar" aria-label="Acenar">👋</button>
   <button class="nb" data-a="talk" disabled title="Conversar" aria-label="Conversar">💬</button>
   <button class="nb" data-a="hug" disabled title="Abraçar" aria-label="Abraçar">🤗</button>
   <button class="nb" data-a="kiss" disabled title="Beijar" aria-label="Beijar">💋</button>
   <button class="nb" data-a="flirt" disabled title="Flertar" aria-label="Flertar">😉</button>
  </div>
  <div id="chat">
   <div class="chead"><b>Conversa geral</b><button class="ib sm" id="cclose" aria-label="Fechar">✖</button></div>
   <div id="log"></div>
   <div class="row"><input id="say" type="text" maxlength="60" placeholder="Digite sua mensagem" autocomplete="off" enterkeyhint="send"><button class="p" id="send">Enviar</button></div>
  </div>
 </div>
</div>
<script>
// ===== Tempo real sem cadastro (broker MQTT público) =====
const NS='clubpixel-m4k7q2x9';
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
window.claude={use:async()=>{
 if(!window.mqtt)return null;
 return {join:async(name)=>{
  const id=Math.random().toString(36).slice(2,10),base=NS+'/'+name+'/',topic=base+id;
  let st={},remote={},seenAt={},curMap={},oldS={},cb=null,onDisc=null,dirty=false,timer=0,hb=0,sw=0,wasOn=false,client=null;
  const wrap=(k,v)=>({peer:k,presence:v,isMe:k===id,sameTab:k===id});
  const clean=()=>JSON.parse(JSON.stringify(st));
  function emit(){const nw=Object.assign({},remote);if(Object.keys(st).length)nw[id]=st;
   const ns={};for(const k in nw)ns[k]=JSON.stringify(nw[k]);
   const joined=[],updated=[],left=[];
   for(const k in ns){if(!(k in oldS))joined.push(wrap(k,nw[k]));else if(oldS[k]!==ns[k])updated.push(wrap(k,nw[k]))}
   for(const k in oldS)if(!(k in ns))left.push(wrap(k,JSON.parse(oldS[k])));
   oldS=ns;curMap=nw;
   if(cb&&(joined.length||updated.length||left.length))cb({peers:Object.keys(nw).map(k=>wrap(k,nw[k])),joined:joined,updated:updated,left:left})}
  const pub=()=>{if(client&&client.connected)client.publish(topic,JSON.stringify(Object.assign(clean(),{ts:Date.now()})),{retain:true,qos:0})};
  function connect(url){return new Promise((res,rej)=>{
   const c=mqtt.connect(url,{clientId:'cp_'+id+Math.random().toString(36).slice(2,5),keepalive:20,reconnectPeriod:2000,connectTimeout:6000,clean:true,will:{topic:topic,payload:'',retain:true,qos:0}});
   const to=setTimeout(()=>{c.removeAllListeners();c.end(true);rej(new Error('timeout'))},7000);
   const ok=()=>{clearTimeout(to);c.removeListener('error',bad);res(c)};
   const bad=e=>{clearTimeout(to);c.removeAllListeners();c.end(true);rej(e)};
   c.once('connect',ok);c.once('error',bad)})}
  for(const u of BROKERS){try{client=await connect(u);break}catch(e){client=null}}
  if(!client){const e=new Error('sem conexao');e.code='SEM_CONEXAO';throw e}
  wasOn=true;
  client.on('error',()=>{});
  client.on('message',(tp,pl)=>{const k=tp.slice(base.length);if(!k||k===id)return;const s=pl.toString();
   if(!s){delete remote[k];delete seenAt[k]}
   else{try{const v=JSON.parse(s);if(Date.now()-(v.ts||0)>60000)return;delete v.ts;remote[k]=v;seenAt[k]=Date.now()}catch(e){return}}
   emit()});
  client.on('close',()=>{if(wasOn&&onDisc)onDisc()});
  client.on('connect',()=>{client.subscribe(base+'+');pub()});
  client.subscribe(base+'+');
  hb=setInterval(()=>{if(Object.keys(st).length)pub()},15000);
  sw=setInterval(()=>{let ch=false;for(const k in seenAt)if(Date.now()-seenAt[k]>45000){delete remote[k];delete seenAt[k];ch=true}if(ch)emit()},8000);
  await new Promise(r=>setTimeout(r,900));
  return {
   presence(patch){Object.assign(st,patch);emit();if(!dirty){dirty=true;timer=setTimeout(()=>{dirty=false;pub()},90)}},
   onPeers(c,d){cb=c;onDisc=d;const all=Object.keys(curMap).map(k=>wrap(k,curMap[k]));if(all.length)c({peers:all,joined:all,updated:[],left:[]})},
   peers(){return Object.keys(curMap).map(k=>wrap(k,curMap[k]))},
   leave(){wasOn=false;clearTimeout(timer);clearInterval(hb);clearInterval(sw);const c=client;try{c.publish(topic,'',{retain:true},()=>c.end(true))}catch(e){}setTimeout(()=>{try{c.end(true)}catch(e){}},600)}
  }}}}};
const EXPIRES=new Date('2026-11-22T23:59:59-03:00').getTime();
const ROOMS=[
 {id:'pista',name:'Pista Neon',p:[0xff2d95,0x22d3ee,0x8a5cff]},
 {id:'lounge',name:'Lounge',p:[0xb06cff,0xffc24a,0xff5d8f]},
 {id:'vip',name:'Camarote VIP',p:[0xffc24a,0xff3b3b,0xffffff]},
 {id:'retro',name:'Pista Retrô',p:[0x39ff88,0xfff04a,0x2de2ff]}
];
const SHIRT=['#d94f4f','#4f7fd9','#e0b43a','#8a56c8','#3aa77a','#e07a3a','#d95fa0','#4a4a5a'];
const HAIR=['#2b1b10','#6b3f1d','#d9b13a','#b33a2a','#222'];
const BK=['#cc4444','#4488cc','#ccbb44','#44aa66','#aa55cc'];
const EMO={wave:'👋',talk:'💬',hug:'🤗',kiss:'💋',flirt:'😉'};
const VERB={wave:'acenou para',talk:'está conversando com',hug:'abraçou',kiss:'beijou',flirt:'flertou com'};
const $=id=>document.getElementById(id);
let R=null,nr=null,cfg=null,me=null,sm={},seen={},keys={},raf=0,last=0,myName='',lastSent='',nearP=null,musicBy='';

function hs(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function say(t){const m=$('msg');m.textContent=t;m.style.display=t?'block':'none'}
function log(t,c){const L=$('log'),d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;L.appendChild(d);L.scrollTop=L.scrollHeight;while(L.children.length>80)L.firstChild.remove();const m=$('mini');if(m){const d2=document.createElement('div');d2.textContent=t;if(c)d2.style.color=c;m.appendChild(d2);while(m.children.length>5)m.firstChild.remove();setTimeout(()=>d2.remove(),12000)}}
const expired=()=>Date.now()>EXPIRES;
$('until').textContent='Aberto até '+new Date(EXPIRES).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
ROOMS.forEach(r=>{const b=document.createElement('button');b.textContent=({pista:'🪩',lounge:'🛋️',vip:'👑',retro:'📼'}[r.id]||'')+' '+r.name;b.onclick=()=>enter(r);$('rl').appendChild(b)});
if(expired()){say('Este chat foi encerrado.');document.querySelectorAll('#rl button').forEach(b=>b.disabled=true)}

// ---- música (sintetizada, sem arquivos externos)
let AC=null,mute=false,cur=-1,seqT=0,stp=0,nextT=0;
const TR=[
 {n:'Chiptune',bpm:140,w:'square',v:.05,d:4,m:[0,4,7,12,7,4,7,12,2,5,9,14,9,5,9,14],b:[-12,null,-12,null,-12,null,-12,null,-10,null,-10,null,-10,null,-10,null]},
 {n:'Samba',bpm:112,w:'triangle',v:.12,d:4,m:[7,null,9,7,4,null,7,9,12,null,9,7,4,null,2,4],b:[-12,null,-5,null,-12,null,-5,null,-10,null,-3,null,-10,null,-5,null]},
 {n:'Lo-fi',bpm:80,w:'sine',v:.14,d:8,m:[4,null,null,7,null,11,null,null,9,null,null,5,null,7,null,null],b:[-8,null,null,null,null,null,-8,null,-3,null,null,null,-1,null,null,null]},
 {n:'Disco',bpm:124,w:'sawtooth',v:.035,d:4,m:[12,null,12,7,null,12,null,14,12,null,12,7,null,5,null,7],b:[-12,-12,null,-12,-12,null,-12,-12,-8,-8,null,-8,-8,null,-8,-8]}
];
function tone(f,t,d,ty,v,fe){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const NF=n=>261.63*Math.pow(2,n/12);
function sched(){const tr=TR[cur];if(!tr||!AC)return;const d=30/tr.bpm;
 while(nextT<AC.currentTime+.3){const i=stp%16,m=tr.m[i],b=tr.b[i];
  if(!mute){if(m!=null)tone(NF(m),nextT,d*.9,tr.w,tr.v||.06);if(b!=null)tone(NF(b),nextT,d*1.8,'triangle',.1);if(i%tr.d===0)tone(120,nextT,.12,'sine',.22,45)}
  nextT+=d;stp++}}
function setTrack(i){if(i===cur)return;cur=i;clearInterval(seqT);if(i<0||!AC)return;stp=0;nextT=AC.currentTime+.05;seqT=setInterval(sched,100)}
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
document.querySelectorAll('#jk button').forEach(b=>b.onclick=()=>{if(nr)nr.presence({mu:+b.dataset.t,ma:Date.now()})});

// ---- entrar / sair
async function enter(r){
 const n=$('nm').value.trim().replace(/\s+/g,' ').slice(0,12);
 if(!n){say('Digite seu nome primeiro.');return}
 if(expired()){say('Este chat foi encerrado.');return}
 if(!window.THREE){say('Não foi possível carregar o 3D. Recarregue a página.');return}
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){AC=null}
 say('Conectando…');
 try{R=window.claude&&await window.claude.use('room')}catch(e){R=null}
 if(!R){say('Não foi possível iniciar a conexão em tempo real. Recarregue a página.');return}
 try{nr=await R.join('club-'+r.id)}catch(e){say(e&&e.code==='SEM_CONEXAO'?'Sem conexão com o servidor de tempo real. Tente de novo em instantes.':'Não foi possível entrar nesta pista.');return}
 say('');cfg=r;myName=n;seen={};sm={};cur=-1;me={x:0,y:4.2,d:0,s:0};lastSent='';
 document.body.classList.add('ingame');$('mini').textContent='';$('chat').classList.remove('open');$('menu').classList.add('hide');$('game').classList.remove('hide');$('rn').textContent=r.name;$('log').textContent='';
 if(!startGL(r)){nr.leave();nr=null;document.body.classList.remove('ingame');$('game').classList.add('hide');$('menu').classList.remove('hide');say('Seu navegador não conseguiu abrir o 3D.');return}
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{if(GL)GL.wl=l}).catch(()=>{})}catch(e){}
 const h=hs(n);nr.presence({n:n,c:h%8,h:(h>>3)%5,x:me.x,y:me.y,d:0,s:0});
 nr.onPeers(onPeers,()=>log('Conexão perdida.'));
 log('Você entrou em '+r.name+'. Bem-vindo(a) à conversa geral!');
 last=performance.now();raf=requestAnimationFrame(loop);
}
$('out').onclick=()=>{cancelAnimationFrame(raf);setTrack(-1);stopGL();if(nr){nr.leave();nr=null}document.body.classList.remove('ingame');$('chat').classList.remove('open');$('game').classList.add('hide');$('menu').classList.remove('hide')};

function onPeers(ch){
 const now=Date.now();
 for(const p of ch.left)log((p.presence.n||'Alguém')+' saiu.');
 for(const p of ch.joined.concat(ch.updated)){
  const q=p.presence,s=seen[p.peer]||(seen[p.peer]={init:1}),nm=q.n||'?',c=SHIRT[q.c|0];
  if(s.init&&!p.isMe)log(nm+' está na sala.');s.init=0;
  if(q.sa&&q.sa!==s.sa){s.sa=q.sa;if(now-q.sa<5000)log(nm+': '+String(q.say||'').slice(0,60),c)}
  if(q.at&&q.at!==s.at){s.at=q.at;if(now-q.at<5000){const t=ch.peers.find(x=>x.peer===q.to);log(nm+' '+(VERB[q.act]||'fez algo com')+' '+(t&&t.presence.n||'alguém')+'.')}}
  if(q.dn&&q.dn!==s.dn){s.dn=q.dn;if(now-q.dn<5000){const t=ch.peers.find(x=>x.peer===q.dto);log(nm+(t?' está dançando com '+(t.presence.n||'alguém'):' está dançando')+'! 🎶')}}
  if(q.ma&&q.ma!==s.ma){s.ma=q.ma;if(now-q.ma<5000&&TR[q.mu])log(nm+' colocou '+TR[q.mu].n+' na cabine do DJ. 🎵')}
 }
 let mp=null;for(const p of ch.peers){const q=p.presence;if(typeof q.mu==='number'&&q.ma&&(!mp||q.ma>mp.presence.ma))mp=p}
 if(mp&&mp.presence.mu>=0){setTrack(mp.presence.mu);musicBy=String(mp.presence.n||'')}else{setTrack(-1);musicBy=''}
 $('mus').textContent=cur>=0?'♪ Tocando: '+TR[cur].n+' (por '+musicBy+')':'♪ Sem música. Vá até a cabine do DJ!';
}

// ---- controles
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;const k=KM[e.key];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
const joy={x:0,y:0};let joyId=null;
function joyMove(e){const el=$('joy'),r=el.getBoundingClientRect();let dx=(e.clientX-(r.left+r.width/2))/(r.width/2),dy=(e.clientY-(r.top+r.height/2))/(r.height/2);const m=Math.hypot(dx,dy);
 if(m>1){dx/=m;dy/=m}$('knob').style.transform='translate('+(dx*38).toFixed(1)+'px,'+(dy*38).toFixed(1)+'px)';
 if(m<.22){joy.x=0;joy.y=0}else{joy.x=dx;joy.y=dy}}
function joyEnd(){joyId=null;joy.x=0;joy.y=0;$('knob').style.transform=''}
$('joy').addEventListener('pointerdown',e=>{joyId=e.pointerId;try{$('joy').setPointerCapture(e.pointerId)}catch(x){}joyMove(e);e.preventDefault()});
$('joy').addEventListener('pointermove',e=>{if(e.pointerId===joyId){joyMove(e);e.preventDefault()}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('joy').addEventListener(ev,e=>{if(e.pointerId===joyId)joyEnd()}));

function buildScene(r){
 const sc=new THREE.Scene(),c1=r.p[0],c2=r.p[1],c3=r.p[2];
 sc.background=new THREE.Color(0x0b0714);sc.fog=new THREE.Fog(0x0b0714,45,140);

 const tiles=[];for(let i=0;i<8;i++)for(let j=0;j<6;j++){const m=new THREE.Mesh(new THREE.BoxGeometry(.94,.06,.94),new THREE.MeshBasicMaterial({color:0x222222}));m.position.set(-3.5+i,.03,-1.5+j);sc.add(m);tiles.push({m:m,i:i,j:j})}
 sc.add(box(14.6,4.6,.3,0x1c1230,0,2.3,-5.15),box(.3,4.6,10.4,0x1c1230,-7.15,2.3,0),box(.3,4.6,10.4,0x1c1230,7.15,2.3,0));
 sc.add(neon(14.4,.08,.08,c1,0,.25,-4.98),neon(14.4,.08,.08,c2,0,4.3,-4.98),neon(.08,.08,10,c1,-6.98,.25,0),neon(.08,.08,10,c2,-6.98,4.3,0),neon(.08,.08,10,c1,6.98,.25,0),neon(.08,.08,10,c2,6.98,4.3,0));

 const sg=sign(r.name.toUpperCase(),c1);sg.position.set(0,3.7,-4.94);sc.add(sg);
 const scrC=document.createElement('canvas');scrC.width=192;scrC.height=72;const scrT=new THREE.CanvasTexture(scrC);
 const scr=new THREE.Mesh(new THREE.PlaneGeometry(4.2,1.55),new THREE.MeshBasicMaterial({map:scrT}));scr.position.set(0,1.95,-4.94);sc.add(scr);
 sc.add(box(4.2,1,1.2,0x140c22,0,.5,-4),neon(4.2,.1,.05,c1,0,.8,-3.39),box(4.3,.08,1.3,0x2a1a40,0,1.04,-4));

 [-1.9,2.1].forEach(z=>{sc.add(box(1.2,.5,2.6,0x2a1a44,-6.3,.25,z),box(.3,.95,2.6,0x2a1a44,-6.85,.75,z),box(1,.2,2.4,0x5a2a7a,-6.2,.6,z),box(.8,.4,1.2,0x1a1026,-5.2,.2,z),neon(.8,.03,1.2,c2,-5.2,.42,z))});

 const bl=new THREE.PointLight(0xffffff,.6,10);bl.position.set(0,3.2,.5);sc.add(bl);
 const beams=[];[-4,-2,0,2,4].forEach((x,i)=>{const g=new THREE.Group();g.position.set(x,4.5,-1);const geo=new THREE.CylinderGeometry(.03,1,5.4,20,1,true);geo.translate(0,-2.7,0);
  g.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:r.p[i%3],transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})));sc.add(g);beams.push(g)});

function mkChar(q){
 const g=new THREE.Group(),jk=col(SHIRT[q.c|0]),hr=col(HAIR[q.h|0]),sk=SK[(hs(String(q.n||''))>>7)%4];
 const legL=limb(g,.2,.55,.22,0x3a2f55,-.13,.55,0),legR=limb(g,.2,.55,.22,0x3a2f55,.13,.55,0);

 const body=new THREE.Group();body.position.set(0,.83,0);g.add(body);

 const head=new THREE.Group();head.position.set(0,1.32,0);g.add(head);
 const hm=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);head.add(m);return m};
 hm(.42,.42,.4,sk,0,0,0);hm(.46,.18,.44,hr,0,.2,0);hm(.46,.36,.12,hr,0,.04,-.17);hm(.05,.14,.3,hr,-.22,.08,.02);hm(.05,.14,.3,hr,.22,.08,.02);
 [-.1,.1].forEach(x=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.06,.08,.02),new THREE.MeshBasicMaterial({color:0x111111}));e.position.set(x,.03,.205);head.add(e)});

function mkdiv(c){const d=document.createElement('div');d.className=c;$('ov').appendChild(d);return d}
function startGL(r){
 let ren;try{const small=Math.min(innerWidth,innerHeight)<700;ren=new THREE.WebGLRenderer({antialias:!small,powerPreference:'high-performance'});ren.__small=small}catch(e){return false}
 ren.setPixelRatio(Math.min(window.devicePixelRatio||1,ren.__small?1.5:2));ren.domElement.addEventListener('webglcontextlost',e=>e.preventDefault());$('cvw').insertBefore(ren.domElement,$('ov'));
 const S=buildScene(r),cam=new THREE.PerspectiveCamera(42,1.4,.1,220);cam.position.set(0,11.5,10.5);cam.lookAt(0,.4,.4);
 GL=Object.assign(S,{ren:ren,cam:cam,ents:{},w:0,h:0,v:new THREE.Vector3()});resizeGL();return true}
function resizeGL(){if(!GL)return;const el=$('cvw'),w=el.clientWidth||320,h=el.clientHeight||480;GL.ren.setSize(w,h,false);GL.cam.aspect=w/h;const cf=Math.min(2.7,Math.max(1,1.4/(w/h)*.96));GL.cam.position.y=11.5*cf;GL.cam.position.z=10.5*cf;GL.lz=.4+Math.min(2.4,(cf-1)*1.4);GL.cam.updateProjectionMatrix();GL.w=w;GL.h=h}
addEventListener('resize',resizeGL);

function scr(x,y,z){GL.v.set(x,y,z).project(GL.cam);return [(GL.v.x*.5+.5)*GL.w,(-GL.v.y*.5+.5)*GL.h]}
function put(el,p,dx,dy,tr){el.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px) translate('+tr+')'}

function loop(now){
 raf=requestAnimationFrame(loop);if(!GL)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=Date.now(),k=t/1000;
 const ix=((keys.right?1:0)-(keys.left?1:0))||joy.x,iy=((keys.down?1:0)-(keys.up?1:0))||joy.y,mv=ix||iy;
 if(mv){const m=Math.hypot(ix,iy),sp=4*dt*Math.min(1,m),dx=ix/m*sp,dz=iy/m*sp;if(!blocked(me.x+dx,me.y))me.x+=dx;if(!blocked(me.x,me.y+dz))me.y+=dz;me.d=Math.atan2(ix,iy)}
 me.s=mv?1:0;
 const key=Math.round(me.x*50)+','+Math.round(me.y*50)+','+Math.round(me.d*20)+','+me.s;
 if(key!==lastSent&&nr){lastSent=key;nr.presence({x:Math.round(me.x*50)/50,y:Math.round(me.y*50)/50,d:Math.round(me.d*100)/100,s:me.s})}
 const ps=nr.peers(),mp=ps.find(x=>x.isMe&&x.sameTab),myId=mp&&mp.peer,list=[],by={};
 for(const p of ps){if(p.sameTab)continue;const q=p.presence;if(typeof q.x!=='number')continue;
  const s=sm[p.peer]||(sm[p.peer]={x:q.x,y:q.y});s.x+=(q.x-s.x)*.3;s.y+=(q.y-s.y)*.3;
  const e={p:p,id:p.peer,q:q,x:s.x,y:s.y,name:String(q.n||'?').slice(0,12)};list.push(e);by[p.peer]=e}
 const h=hs(myName),E={me:1,id:myId,q:Object.assign({},mp?mp.presence:{},{n:myName,c:h%8,h:(h>>3)%5,d:me.d,s:me.s}),x:me.x,y:me.y,name:myName};
 list.push(E);if(myId)by[myId]=E;
 const effs=[];
 for(const e of list){const q=e.q;
  if(q.dn&&t-q.dn<8000){e.dn=1;const o=by[q.dto];if(o){o.dn=1;e.fc=e.fc||o;o.fc=o.fc||e}}
  if(q.at&&t-q.at<3500&&q.to&&by[q.to]){const o=by[q.to];e.fc=o;o.fc=o.fc||e;effs.push({e:e,o:o,a:q.act,age:(t-q.at)/3500})}}
 for(const f of effs){const a=f.age,mid=[(f.e.x+f.o.x)/2,2.9+a*.6,(f.e.y+f.o.y)/2];
  if(f.a==='kiss'){f.e.fxT='💋';f.e.fxP=[f.e.x,2.5+a*.5,f.e.y];f.o.fxT='❤️';f.o.fxP=mid;f.o.big=1}
  else if(f.a==='hug'){f.e.fxT='🤗';f.e.fxP=[f.e.x,2.5+a*.5,f.e.y];f.o.fxT='🤗';f.o.fxP=[f.o.x,2.5+a*.5,f.o.y]}
  else{f.e.fxT=EMO[f.a]||'✨';f.e.fxP=[f.e.x,2.5+a*.5,f.e.y]}
  f.e.fxA=f.o.fxA=a}
 let best=null,bd=1.9;for(const e of list){if(e.me)continue;const d=Math.hypot(e.x-me.x,e.y-me.y);if(d<bd){bd=d;best=e}}
 nearP=best?best.p:null;
 $('near').textContent=best?'💞 Perto de '+best.name:'Chegue perto de alguém para interagir';
 document.querySelectorAll('.nb').forEach(b=>b.disabled=!best);
 $('jk').classList.toggle('hide',Math.hypot(me.x,me.y+3)>2.7);
 // luzes e pista
 const bpm=cur>=0?TR[cur].bpm:0,ph=bpm?((k*bpm/60)%1):0,pulse=bpm?Math.pow(1-ph,3):0;
 for(const tl of GL.tiles){tl.m.material.color.setHSL(((tl.i*.06+tl.j*.05+k*.12)%1),.9,bpm?.2+.4*pulse*(.6+.4*Math.sin(tl.i+tl.j+k*2)):.1+.04*Math.sin(k+tl.i))}
 GL.lights.forEach((l,i)=>{l.position.set(Math.sin(k*.8+i*2.1)*4.5,3,Math.cos(k*.6+i*2.1)*3);l.intensity=1.1+pulse*1.2});
 GL.beams.forEach((b,i)=>{b.rotation.x=Math.sin(k*(bpm?1.1:.4)+i)*.55;b.rotation.z=Math.cos(k*(bpm?.9:.3)+i*1.7)*.55;b.children[0].material.opacity=.09+(bpm?.1*pulse:0)});
 GL.ball.rotation.y=k*.8;GL.woofers.forEach(w=>w.scale.set(1+pulse*.2,1,1+pulse*.2));
 const g=GL.scrC.getContext('2d');g.fillStyle='#0a0614';g.fillRect(0,0,192,72);
 for(let i=0;i<16;i++){const hh=bpm?(.15+.85*Math.abs(Math.sin(k*3+i*.7))*(.45+.55*pulse))*50:3;g.fillStyle=hex(cfg.p[i%3]);g.fillRect(6+i*11.5,66-hh,8,hh)}
 g.fillStyle='#fff';g.font='bold 12px monospace';g.textAlign='left';g.fillText(bpm?'♪ '+TR[cur].n:'DJ OFF',6,14);GL.scrT.needsUpdate=true;
 // personagens
 const alive={};
 for(const e of list){const id=e.me?'me':e.id;alive[id]=1;let o=GL.ents[id];
  if(!o){o=mkChar(e.q);o.tag=mkdiv('tag');o.bub=mkdiv('bub');o.fx=mkdiv('fxi');GL.sc.add(o.g);GL.ents[id]=o;o.tag.textContent=e.name;o.tag.style.color=SHIRT[e.q.c|0]}
  const tgt=e.fc?Math.atan2(e.fc.x-e.x,e.fc.y-e.y):(e.q.d||0);let df=tgt-o.ry;df=Math.atan2(Math.sin(df),Math.cos(df));o.ry+=df*.25;o.g.rotation.y=o.ry;
  const moving=e.me?me.s:e.q.s,w=k*10;
  if(e.dn){const s=k*7;o.g.position.set(e.x,Math.abs(Math.sin(s))*.18,e.y);o.armL.rotation.x=-2.5+Math.sin(s)*.6;o.armR.rotation.x=-2.5-Math.sin(s)*.6;o.armL.rotation.z=-.25;o.armR.rotation.z=.25;
   o.legL.rotation.x=Math.sin(s)*.5;o.legR.rotation.x=-Math.sin(s)*.5;o.body.rotation.y=Math.sin(k*3.5)*.45;o.head.rotation.z=Math.sin(k*3.5)*.2;o.mouth.scale.set(1.8,2.5,1)}
  else{o.g.position.set(e.x,0,e.y);const a=moving?Math.sin(w)*.8:0;o.armL.rotation.x+=((-a)-o.armL.rotation.x)*.3;o.armR.rotation.x+=(a-o.armR.rotation.x)*.3;o.armL.rotation.z*=.7;o.armR.rotation.z*=.7;
   o.legL.rotation.x+=(a-o.legL.rotation.x)*.3;o.legR.rotation.x+=((-a)-o.legR.rotation.x)*.3;o.body.rotation.y*=.7;o.head.rotation.z*=.7;o.mouth.scale.set(1,1,1)}
  put(o.tag,scr(e.x,0,e.y+.2),0,0,'-50%,4px');
  if(e.q.sa&&t-e.q.sa<6000){if(o.bt!==e.q.say){o.bt=e.q.say;o.bub.textContent=String(e.q.say||'')}o.bub.style.display='block';put(o.bub,scr(e.x,2.3,e.y),0,0,'-50%,-100%')}else o.bub.style.display='none';
  let ft=e.fxT,fp=e.fxP;if(!ft&&e.dn){ft='🎶';fp=[e.x,2.5+Math.abs(Math.sin(k*4))*.2,e.y]}
  if(ft){if(o.ft!==ft){o.ft=ft;o.fx.textContent=ft}o.fx.className=e.big?'fxi big':'fxi';o.fx.style.display='block';o.fx.style.opacity=e.fxA>.75?Math.max(0,1-(e.fxA-.75)*4):1;put(o.fx,scr(fp[0],fp[1],fp[2]),0,0,'-50%,-100%')}else o.fx.style.display='none';
  e.fxT=e.fxP=e.big=e.fxA=null}
 for(const id in GL.ents)if(!alive[id]){const o=GL.ents[id];GL.sc.remove(o.g);o.tag.remove();o.bub.remove();o.fx.remove();delete GL.ents[id]}
 GL.cam.position.x+=(me.x*.35-GL.cam.position.x)*.06;GL.cam.lookAt(GL.cam.position.x*.7,.5,GL.lz||.4);
 GL.ren.render(GL.sc,GL.cam)}
