<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BabacasFest</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#10091c;--fg:#f3ecff;--card:#1b1230;--line:#6b4fb0;--accent:#ff3fa4;--onacc:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;font-size:10px;line-height:1.7}
body.ingame{position:fixed;inset:0;width:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:520px;margin:0 auto;padding:max(16px,var(--st)) 16px max(24px,var(--sb))}
h1{font-size:18px;text-align:center;margin:18px 0 8px;color:#ff7ac8;text-shadow:0 0 12px #ff3fa4,0 0 28px #8a5cff}
.sub{text-align:center;opacity:.85;margin:0 0 14px}
.card{background:var(--card);border:3px solid var(--line);padding:16px;border-radius:8px}
input[type=text]{width:100%;font:16px/1.2 system-ui,-apple-system,sans-serif;padding:14px;border:3px solid var(--line);background:#0f0820;color:var(--fg);border-radius:8px;margin-top:8px}
input:disabled{opacity:.4}
button{font:inherit;color:var(--fg);background:#2a1a4a;border:3px solid var(--line);padding:12px 10px;cursor:pointer;border-radius:10px;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button.p{background:var(--accent);color:var(--onacc);border-color:#ffd0ec}
button:disabled{opacity:.35}
#msg{display:none;color:#ff9a9a;margin:12px 0 0}
.hide{display:none!important}
#pv{width:180px;height:220px;margin:14px auto 0;border-radius:10px;background:radial-gradient(#3a1a6a,#10091c);overflow:hidden}
.opt{margin-top:12px}.opt b{display:block;margin-bottom:6px;font-size:9px;opacity:.85}
.sws,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #3a2a60}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.chip{padding:9px 10px;font-size:9px;border-radius:16px}
.chip.on{background:var(--accent);border-color:#ffd0ec}
#game{position:fixed;inset:0}
#cvw{position:absolute;inset:0;background:#0b0714;overflow:hidden}
#cvw canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:9px;background:rgba(10,6,20,.7);padding:2px 5px;white-space:nowrap;border-radius:3px}
.bub{position:absolute;left:0;top:0;background:#fff;color:#2b2038;border:2px solid #2b2038;padding:5px 8px;font-size:10px;max-width:200px;text-align:center;display:none;line-height:1.35;word-break:break-word;border-radius:6px}
.fxi{position:absolute;left:0;top:0;font-size:24px;display:none;filter:drop-shadow(0 0 4px #000)}
.fxi.big{font-size:44px;animation:pul .45s infinite alternate}
@keyframes pul{from{scale:1}to{scale:1.3}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) calc(8px + var(--sr)) 8px calc(10px + var(--sl));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#topl{text-shadow:0 1px 4px #000;font-size:9px;min-width:0}
#topl b{font-size:11px}
#tb{display:flex;gap:6px;pointer-events:auto}
.ib{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(20,10,40,.72)}
.ib.sm{width:38px;height:38px;font-size:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b3b;margin-left:6px}
#chatbtn{position:relative}#cdot{position:absolute;right:4px;top:4px;margin:0}
#mini{position:absolute;left:calc(10px + var(--sl));top:calc(86px + var(--st));right:70px;pointer-events:none;font-size:9px}
#mini div{background:rgba(10,6,20,.6);padding:3px 7px;margin-bottom:3px;border-radius:4px;width:fit-content;max-width:100%;word-break:break-word}
#reqs{position:absolute;left:0;right:0;top:calc(76px + var(--st));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;padding:0 10px}
.req{pointer-events:auto;background:rgba(27,18,48,.97);border:3px solid var(--accent);border-radius:10px;padding:10px;max-width:420px;width:100%;font-size:10px}
.req .rb{display:flex;gap:6px;margin-top:8px}.req button{padding:9px 6px;font-size:9px;flex:1}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(270px + var(--sb) + var(--lift,0px));background:rgba(10,6,20,.88);padding:8px 12px;border-radius:8px;display:none;z-index:7;max-width:90%;text-align:center;pointer-events:none}
#jk,#bk{position:absolute;left:0;right:0;bottom:calc(214px + var(--sb) + var(--lift,0px));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#jk button,#bk button{padding:11px 10px;font-size:10px;background:rgba(20,10,40,.88)}
#jk button.p{background:var(--accent)}
#joy{position:absolute;left:calc(18px + var(--sl));bottom:calc(22px + var(--sb) + var(--lift,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.28);touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:rgba(255,63,164,.6);border:3px solid #ffd0ec;pointer-events:none}
#acts{position:absolute;right:calc(10px + var(--sr));bottom:calc(18px + var(--sb) + var(--lift,0px));display:grid;grid-template-columns:repeat(3,54px);gap:8px}
#acts button{width:54px;height:54px;padding:0;font-size:23px;border-radius:50%;background:rgba(20,10,40,.78)}
#rx{position:absolute;right:calc(10px + var(--sr));bottom:calc(206px + var(--sb) + var(--lift,0px));display:none;gap:6px;background:rgba(20,10,40,.92);padding:6px;border-radius:30px;z-index:4}
#rx.open{display:flex}
#rx button{width:44px;height:44px;padding:0;font-size:22px;border-radius:50%}
#chat{position:absolute;left:0;right:0;bottom:0;height:var(--chatH,38vh);max-height:88vh;background:rgba(16,9,28,.97);border-top:3px solid var(--line);padding:10px 10px calc(10px + var(--sb));display:none;flex-direction:column;z-index:5;-webkit-user-select:text;user-select:text}
#chat.open{display:flex}
#grip{height:28px;margin:-8px -10px 2px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;flex:none}
#grip i{width:60px;height:6px;border-radius:3px;background:var(--line)}
#pl{position:absolute;left:10px;right:10px;top:calc(84px + var(--st));bottom:calc(20px + var(--sb));max-width:480px;margin:0 auto;background:rgba(16,9,28,.97);border:3px solid var(--line);border-radius:12px;padding:12px;z-index:8;display:flex;flex-direction:column;max-height:70vh}
.plh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#pll{overflow-y:auto;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
#pll button{text-align:left;padding:12px;font-size:10px;line-height:1.5}
#pll button.on{border-color:#ffd0ec;background:#4a1a6a}
#pll button.lock{opacity:.5}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tabs{display:flex;gap:6px}.tab{padding:10px 12px;font-size:9px;border-radius:8px}.tab.on{background:var(--accent);border-color:#ffd0ec}
#convs{display:none;gap:6px;overflow-x:auto;padding:4px 0 6px;touch-action:pan-x}#convs.show{display:flex}
#convs .chip,#quick .chip{white-space:nowrap}
#log{flex:1;overflow-y:auto;border:2px solid var(--line);border-radius:6px;padding:8px;background:#0f0820;word-break:break-word;touch-action:pan-y}
#log div{margin-bottom:6px}
#quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;touch-action:pan-x}
.row{display:flex;gap:8px;margin-top:8px}.row input{margin-top:0}
</style>
</head>
<body>
<div id="app">
 <div id="menu">
  <h1>BabacasFest 🎉</h1>
  <div class="sub" id="sub">Crie seu personagem e entre na festa</div>
  <div class="card">
   <label for="nm">Seu nome</label>
   <input id="nm" type="text" maxlength="12" placeholder="ex.: Ana" autocomplete="off">
   <div id="pv"></div>
   <div id="opts"></div>
   <button class="p" id="enter" style="width:100%;margin-top:20px;padding:20px 10px;font-size:11px">Entrar na BabacasFest 🎉</button>
   <p id="msg"></p>
   <p id="until" class="sub" style="margin-top:14px"></p>
   <p class="sub" style="margin:0">Celular: joystick e botões na tela. Computador: setas ou WASD.</p>
  </div>
 </div>
 <div id="game" class="hide">
  <div id="cvw"><div id="ov"></div></div>
  <div id="top">
   <div id="topl"><b id="rn"></b><div id="near"></div><div id="mus"></div></div>
   <span id="tb"><button class="ib" id="chatbtn" aria-label="Conversa">🗨️<i id="cdot" class="dot hide"></i></button><button class="ib" id="mute" aria-label="Som">🔊</button><button class="ib" id="out" aria-label="Sair">✖</button></span>
  </div>
  <div id="mini"></div>
  <div id="reqs"></div>
  <div id="toast"></div>
  <div id="jk" class="hide"><button class="p" id="djb">🎧 Escolher música</button></div>
  <div id="bk" class="hide" style="justify-content:center;display:none"></div>
  <div id="pl" class="hide"><div class="plh"><b id="plt"></b><button class="ib sm" id="plx" aria-label="Fechar">✖</button></div><div id="pll"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="rx"><button data-e="🔥">🔥</button><button data-e="👏">👏</button><button data-e="🎉">🎉</button><button data-e="😂">😂</button><button data-e="❤️">❤️</button></div>
  <div id="acts">
   <button id="dsolo" aria-label="Dançar">🕺</button>
   <button class="nb" data-q="dance" disabled aria-label="Dançar junto">👯</button>
   <button class="nb" data-a="wave" disabled aria-label="Acenar">👋</button>
   <button class="nb" id="talk" disabled aria-label="Conversa privada">💬</button>
   <button class="nb" data-q="hug" disabled aria-label="Abraçar">🤗</button>
   <button class="nb" data-q="kiss" disabled aria-label="Beijar">💋</button>
   <button class="nb" data-a="flirt" disabled aria-label="Flertar">😉</button>
   <button id="rxbtn" aria-label="Reações">😀</button>
   <button id="drinkbtn" disabled aria-label="Beber">🥂</button>
  </div>
  <div id="chat">
   <div id="grip" aria-label="Arraste para ajustar o tamanho"><i></i></div>
   <div class="chead"><div class="tabs"><button class="tab on" id="tg">Geral<i id="gdot" class="dot hide"></i></button><button class="tab" id="tp">Privado<i id="pdot" class="dot hide"></i></button></div><button class="ib sm" id="cclose" aria-label="Fechar">✖</button></div>
   <div id="convs"></div>
   <div id="log"></div>
   <div id="quick"></div>
   <div class="row"><input id="say" type="text" maxlength="80" placeholder="Mensagem para todos" autocomplete="off" enterkeyhint="send"><button class="p" id="send">Enviar</button></div>
  </div>
 </div>
</div>
<script>
// ======================= CONFIGURAÇÃO =======================
const HIVEMQ={host:'',user:'',pass:''};
const PARTY={open:'',close:''};
const NS='cp5-b8a9v1';
// ==========================================================================
const $=id=>document.getElementById(id);
const ROOM={id:'babacasfest',name:'BabacasFest',p:[0xff2d95,0x22d3ee,0x8a5cff]};
const WX=32,WZ=22,CELL=12,NCX=6,NCZ=4;
const r2=v=>Math.round(v*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function cellOf(x,z){return [clamp(Math.floor((x+WX)/CELL),0,NCX-1),clamp(Math.floor((z+WZ)/CELL),0,NCZ-1)]}
const tOpen=PARTY.open?new Date(PARTY.open).getTime():0,tClose=PARTY.close?new Date(PARTY.close).getTime():Infinity;
const phase=()=>{const n=Date.now();return n<tOpen?'before':(n>tClose?'after':'open')};
const SKIN=[0xf6d3b3,0xf0c09a,0xd9a27a,0xb97a52,0x8a5a3a,0x5a3a28];
const HAIRC=[0x2b1b10,0x6b3f1d,0xd9b13a,0xb33a2a,0x111111,0xeeeeee,0x3a8fe0,0xe03a9a];
const SHIRTC=[0xd94f4f,0x4f7fd9,0xe0b43a,0x8a56c8,0x3aa77a,0xe07a3a,0xd95fa0,0x4a4a5a,0xf2f2f2,0x1fd1c4];
const PANTSC=[0x3a2f55,0x222222,0x3a5a8a,0x6a4a2a,0x8a2a3a,0xdddddd];
const HEX=c=>'#'+c.toString(16).padStart(6,'0');
const SHCSS=i=>HEX(SHIRTC[(i|0)%10]);

// ======================= Rede por áreas (MQTT) =======================
async function connectNet(room,H){
 const id=Math.random().toString(36).slice(2,12),base=NS+'/'+room+'/';
 const brokers=HIVEMQ.host?[{url:'wss://'+HIVEMQ.host+':8884/mqtt',username:HIVEMQ.user,password:HIVEMQ.pass}]:[{url:'wss://broker.hivemq.com:8884/mqtt'},{url:'wss://broker.emqx.io:8084/mqtt'}];
 let client=null;
 for(const b of brokers){
  try{client=await new Promise((res,rej)=>{
   const o={clientId:'cp_'+id,keepalive:20,reconnectPeriod:2000,connectTimeout:6000,clean:true};if(b.username){o.username=b.username;o.password=b.password}
   const c=mqtt.connect(b.url,o);const to=setTimeout(()=>{c.removeAllListeners();c.end(true);rej(new Error('timeout'))},8000);
   const ok=()=>{clearTimeout(to);c.removeListener('error',bad);res(c)},bad=e=>{clearTimeout(to);c.removeAllListeners();c.end(true);rej(e)};
   c.once('connect',ok);c.once('error',bad)});break}catch(e){client=null}}
 if(!client){const e=new Error('sem conexao');e.code='SEM_CONEXAO';throw e}
 let cells=new Set(),myCell=null,wasOn=true;
 const pt=c=>base+'p/'+c+'/';
 const send=(t,m,o)=>{if(client.connected)client.publish(t,m,o||{qos:0})};
 const sub=()=>{client.subscribe([base+'g',base+'m',base+'d/'+id]);cells.forEach(c=>client.subscribe(pt(c)+'+'))};
 client.on('error',()=>{});
 client.on('close',()=>{if(wasOn&&H.disc)H.disc()});
 client.on('connect',sub);
 client.on('message',(tp,pl)=>{
  if(tp.startsWith(base+'p/')){const rest=tp.slice(base.length+2),i=rest.indexOf('/'),cell=rest.slice(0,i),pid=rest.slice(i+1);if(pid===id)return;let q;try{q=JSON.parse(pl.toString())}catch(e){return}H.state(pid,cell,q)}
  else if(tp===base+'g'){try{H.global(JSON.parse(pl.toString()))}catch(e){}}
  else if(tp===base+'d/'+id){try{H.dm(JSON.parse(pl.toString()))}catch(e){}}
  else if(tp===base+'m'){const s=pl.toString();try{H.music(s?JSON.parse(s):null)}catch(e){}}});
 sub();
 return {
  id:id,
  setCell(cx,cz){const key=cx+'_'+cz;if(key===myCell)return false;const old=myCell;myCell=key;
   const want=new Set();for(let a=cx-1;a<=cx+1;a++)for(let b=cz-1;b<=cz+1;b++)if(a>=0&&b>=0&&a<NCX&&b<NCZ)want.add(a+'_'+b);
   for(const c of cells)if(!want.has(c))client.unsubscribe(pt(c)+'+');
   for(const c of want)if(!cells.has(c))client.subscribe(pt(c)+'+');
   cells=want;if(old)send(pt(old)+id,'{"g":1}');return {old:old}},
  has:c=>cells.has(c),
  pub(q){if(myCell)send(pt(myCell)+id,JSON.stringify(q))},
  global:m=>send(base+'g',JSON.stringify(m)),
  dm:(to,m)=>send(base+'d/'+to,JSON.stringify(m),{qos:1}),
  music:m=>send(base+'m',m?JSON.stringify(m):'',{qos:1,retain:true}),
  leave(){wasOn=false;if(myCell)send(pt(myCell)+id,'{"g":1}');const c=client;setTimeout(()=>{try{c.end(true)}catch(e){}},400)}
 }}

// ======================= Músicas =======================
const MUS=[
 {t:'Neon Chiptune',a:'Demo',f:'musica-chiptune.wav',d:40,bp:140},
 {t:'Samba da Babaca',a:'Demo',f:'musica-samba.wav',d:40,bp:112},
 {t:'Disco Fever',a:'Demo',f:'musica-disco.wav',d:40,bp:124},
 {t:'Dance Monster',a:'Kevin MacLeod',f:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2003%20-%20Dance%20Monster.mp3',d:180,bp:120},
 {t:'Enter the Party',a:'Kevin MacLeod',f:'https://ia800300.us.archive.org/15/items/Kevin-MacLeod_Medium-Electronic_2008_FullAlbum/Kevin%20MacLeod%20-%2006%20-%20Enter%20the%20Party.mp3',d:180,bp:120}
];

// ======================= Personagens =======================
const VM=new THREE.MeshLambertMaterial({vertexColors:true});
const SHM=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.4});
let SHG=null;
const CUPG=new THREE.CylinderGeometry(.09,.07,.2,10),LIQG=new THREE.CylinderGeometry(.075,.06,.15,10),CUPM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35});
function bx(w,h,d,x,y,z,c){const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);const n=g.attributes.position.count,col=new Float32Array(n*3),cc=new THREE.Color(c);
 for(let i=0;i<n;i++){col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b}g.setAttribute('color',new THREE.BufferAttribute(col,3));return g}
function mergeG(gs){let n=0,ni=0;gs.forEach(g=>{n+=g.attributes.position.count;ni+=g.index.count});
 const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3),I=new Uint16Array(ni);let o=0,oi=0;
 gs.forEach(g=>{const ix=g.index.array;P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);for(let i=0;i<ix.length;i++)I[oi+i]=ix[i]+o;o+=g.attributes.position.count;oi+=ix.length;g.dispose()});
 const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P,3));m.setAttribute('normal',new THREE.BufferAttribute(N,3));m.setAttribute('color',new THREE.BufferAttribute(C,3));m.setIndex(new THREE.BufferAttribute(I,1));return m}
function piv(par,x,y,z,geo){const g=new THREE.Group();g.position.set(x,y,z);g.add(new THREE.Mesh(geo,VM));par.add(g);return g}
function mkChar(L){
 const sk=SKIN[L[0]%6],hs=L[1]%5,hc=HAIRC[L[2]%8],sc=SHIRTC[L[3]%10],pc=PANTSC[L[4]%6],st=L[5]%2;
 const g=new THREE.Group();
 const legG=()=>mergeG([bx(.2,.55,.22,0,-.275,0,pc),bx(.22,.12,.32,0,-.5,.05,0x1a1020)]);
 const legL=piv(g,-.13,.55,0,legG()),legR=piv(g,.13,.55,0,legG());
 const armG=()=>st?mergeG([bx(.15,.4,.17,0,-.2,0,sc),bx(.15,.14,.17,0,-.47,0,sk)]):mergeG([bx(.15,.24,.17,0,-.12,0,sc),bx(.15,.3,.17,0,-.39,0,sk)]);
 const armL=piv(g,-.37,1.07,0,armG()),armR=piv(g,.37,1.07,0,armG());
 const cup=new THREE.Group();cup.position.set(0,-.5,.1);cup.add(new THREE.Mesh(CUPG,CUPM));const liq=new THREE.Mesh(LIQG,new THREE.MeshBasicMaterial({color:0xffffff}));liq.position.y=-.02;cup.add(liq);cup.visible=false;armR.add(cup);
 const body=piv(g,0,.83,0,mergeG([bx(.56,.55,.3,0,0,0,sc),bx(.57,.08,.31,0,-.24,0,pc)]));
 const hp=[bx(.42,.42,.4,0,0,0,sk),bx(.06,.08,.02,-.1,.03,.205,0x111111),bx(.06,.08,.02,.1,.03,.205,0x111111),bx(.1,.03,.02,0,-.09,.205,0xb85a4a)];
 if(hs!==4&&hs!==3){hp.push(bx(.46,.18,.44,0,.2,0,hc),bx(.05,.14,.3,-.22,.08,.02,hc),bx(.05,.14,.3,.22,.08,.02,hc));
  if(hs===1)hp.push(bx(.46,.8,.12,0,-.14,-.17,hc),bx(.05,.5,.3,-.22,-.08,.02,hc),bx(.05,.5,.3,.22,-.08,.02,hc));else hp.push(bx(.46,.34,.12,0,.04,-.17,hc));
  if(hs===2)hp.push(bx(.2,.2,.2,0,.4,-.05,hc))}

 if(mine.mk&&n-mine.tMk<3000)q.mk=mine.mk;
 if(mine.dk)q.dk=mine.dk;
 if(mine.dd&&n-mine.tDd<3500)q.dd=mine.dd;
 if(mine.fall&&n-mine.tFall<8500)q.fall=mine.fall;
 return q}

function loop(now){
 raf=requestAnimationFrame(loop);if(!GL||!net)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=Date.now(),k=t/1000;
 if(phase()==='after'){leaveGame('A festa acabou. Obrigado por vir! 🌙');return}
 const dead=mine.fall&&t-mine.tFall<8000;
 const ix=dead?0:(((keys.right?1:0)-(keys.left?1:0))||joy.x),iy=dead?0:(((keys.down?1:0)-(keys.up?1:0))||joy.y),mv=ix||iy;
 const drunk=Math.max(0,mine.drinks-2)*.015;
 if(mv&&!dead){const m=Math.hypot(ix,iy),sp=4.5*dt*Math.min(1,m),dx=ix/m*sp+(drunk?Math.sin(k*8)*drunk:0),dz=iy/m*sp+(drunk?Math.cos(k*8)*drunk:0);if(!blocked(me.x+dx,me.y,me.h))me.x+=dx;if(!blocked(me.x,me.y+dz,me.h))me.y+=dz;me.d=Math.atan2(ix,iy)}
 me.s=(mv&&!dead)?1:0;me.h+=(elevAt(me.x,me.y,me.h)-me.h)*.25;syncCell();
 const key=r2(me.x)+','+r2(me.y)+','+r2(me.d)+','+me.s+','+r2(me.h),dp=t-lastPub;
 if((force&&dp>90)||(key!==lastKey&&dp>(me.s?250:90))||dp>3000){if(helloP){net.pub({h:1,p:helloP.p});helloP=null}const full=force||dp>3000||t-lastFull>2800;net.pub(buildState(!full));lastPub=t;lastKey=key;force=false;if(full)lastFull=t}
 for(const id in R)if(t-R[id].seen>9000)delete R[id];
 if(t-lastSync>2000){lastSync=t;syncAudio()}
 if(t-lastMusTxt>500){lastMusTxt=t;setMusText();if(!$('pl').classList.contains('hide'))renderPl()}
 const arr=[];for(const id in R){const e=R[id];e.sx+=(e.q.x-e.sx)*.3;e.sy+=(e.q.y-e.sy)*.3;e.dist=Math.hypot(e.sx-me.x,e.sy-me.y);arr.push(e)}
 arr.sort((a,b)=>a.dist-b.dist);
 const list=arr.slice(0,40).map(e=>({id:e.id,x:e.sx,y:e.sy,q:e.q,name:String(e.q.n||'?').slice(0,12),tAct:e.tAct||0,tDn:e.tDn||0,tSay:e.tSay||0,tDd:e.tDd||0,tMk:e.tMk||0,tFall:e.tFall||0,dist:e.dist,mv:e.q.s,hh:+e.q.h||0}));
 const E={me:1,id:myId,x:me.x,y:me.y,q:buildState(),name:myName,tAct:mine.tAct,tDn:mine.tDn,tSay:mine.tSay,tDd:mine.tDd,tMk:mine.tMk,tFall:mine.tFall,dist:0,mv:me.s,hh:me.h};
 list.push(E);const by={};list.forEach(e=>{by[e.id]=e});
 const effs=[];
 for(const e of list){const q=e.q;
  if(q.dn&&t-e.tDn<8000){e.dn=1;const o=by[q.dto];if(o){o.dn=1;e.fc=e.fc||o;o.fc=o.fc||e}}
  if(q.at&&t-e.tAct<3500){const age=(t-e.tAct)/3500,o=q.to&&by[q.to];
   if(o&&(q.act==='kiss'||q.act==='hug')){e.fc=o;o.fc=o.fc||e;effs.push({e:e,o:o,a:q.act,age:age})}
   else{if(o){e.fc=o;o.fc=o.fc||e}effs.push({e:e,o:null,a:q.act,age:age,em:q.em})}}}
 for(const f of effs){const a=f.age,e=f.e,hy=e.hh;
  if(f.o){const mid=[(e.x+f.o.x)/2,hy+2.9+a*.6,(e.y+f.o.y)/2];
   if(f.a==='kiss'){e.fxT='💋';e.fxP=[e.x,hy+2.5+a*.5,e.y];f.o.fxT='❤️';f.o.fxP=mid;f.o.big=1}
   else{e.fxT='🤗';e.fxP=[e.x,hy+2.5+a*.5,e.y];f.o.fxT='🤗';f.o.fxP=[f.o.x,f.o.hh+2.5+a*.5,f.o.y]}
   f.o.fxA=a}
  else{e.fxT=f.a==='rx'?String(f.em||'✨').slice(0,4):(EMO[f.a]||'✨');e.fxP=[e.x,hy+2.5+a*.5,e.y]}
  e.fxA=a}
 let best=null,bd=2.2;for(const e of list){if(!e.me&&e.dist<bd&&Math.abs(e.hh-me.h)<1.6){bd=e.dist;best=e}}
 nearE=best;
 if(!!best!==lastNearOn){lastNearOn=!!best;document.querySelectorAll('.nb').forEach(b=>{b.disabled=!best})}
 $('near').textContent=best?'💞 Perto de '+best.name:'Chegue perto de alguém para interagir';
 const nj=me.h<1&&Math.hypot(me.x,me.y+15.6)<3.8;if(nj!==lastDj){lastDj=nj;$('jk').classList.toggle('hide',!nj);if(!nj)closePl()}
 // --- interação com bartender (distância dos NPCs no balcão) ---
 const nearBartender=me.h<1&&Math.hypot(me.x-30,me.y-(-6))<4.5||Math.hypot(me.x-30,me.y-3)<4.5;
 const hold=mine.dk>0,making=mine.mk&&t-mine.tMk<2800;
 const nb=nearBartender&&!hold&&!making&&!dead;if(nb!==lastBar){lastBar=nb;$('bk').style.display=nb?'flex':'none'}
 if(hold!==lastHold){lastHold=hold;$('drinkbtn').disabled=!hold}
 // câmera
 const tx=clamp(me.x,-23,23),tz=clamp(me.y,-11,12);GL.cx+=(tx-GL.cx)*.12;GL.cz+=(tz-GL.cz)*.12;GL.cy+=(me.h-GL.cy)*.1;
 const camShakeX=drunk?Math.sin(k*15)*drunk*10:0, camShakeY=drunk?Math.cos(k*12)*drunk*10:0;
 GL.cam.position.set(GL.cx+camShakeX,11.5*GL.cf+GL.cy+camShakeY,GL.cz+10.5*GL.cf);GL.cam.lookAt(GL.cx,.5+GL.cy,GL.cz+GL.lz);GL.cam.updateMatrixWorld();
 // mezanino
 const up=me.h>MH/2;GL.W.mzMat.opacity+=((up?1:.2)-GL.W.mzMat.opacity)*.2;GL.W.top.visible=up||GL.W.mzMat.opacity>.6;
 // luzes
 const on=song&&!song.ended,bpm=on?song.bp:0,ph=bpm?((elapsed()*bpm/60)%1):0,pulse=bpm?Math.pow(1-ph,3):0;animWorld(GL.W,k,bpm,pulse,t,on?'♪ '+song.t:'');
 // personagens
 const alive={};
 for(const e of list){const id=e.id;alive[id]=1;let o=GL.ents[id];
  if(!o){const L=(Array.isArray(e.q.L)&&e.q.L.length===6)?e.q.L.map(v=>v|0):look;o=mkChar(L);o.tag=mkdiv('tag');o.bub=mkdiv('bub');o.fx=mkdiv('fxi');o.h=e.hh;GL.sc.add(o.g);GL.ents[id]=o;o.tag.textContent=e.name;o.tag.style.color=SHCSS(L[3])}
  const tgt=e.fc?Math.atan2(e.fc.x-e.x,e.fc.y-e.y):(e.q.d||0);let df=tgt-o.ry;df=Math.atan2(Math.sin(df),Math.cos(df));o.ry+=df*.25;o.g.rotation.y=o.ry;
  o.h+=(e.hh-o.h)*.25;const w=k*10,dkI=(+e.q.dk||0),holding=dkI>0&&dkI<=DRINKS.length,drinking=holding&&e.q.dd&&t-e.tDd<3300,making=e.q.mk&&t-e.tMk<2800;
  const fallen=e.q.fall&&t-e.tFall<8000;
  o.cup.visible=!!holding&&!fallen;
  if(holding&&!fallen){o.liq.material.color.setHex(DRINKS[dkI-1].c);o.liq.scale.y=drinking?Math.max(.1,1-(t-e.tDd)/3300*.9):1;o.cup.rotation.x=drinking?-.7:0}
  
  if(fallen){
    o.g.position.set(e.x,o.h+.2,e.y);
    o.g.rotation.z=1.45; // Deitado
    o.armL.rotation.x=0;o.armR.rotation.x=0;o.armL.rotation.z=-.5;o.armR.rotation.z=.5;
    o.legL.rotation.x=0;o.legR.rotation.x=0;o.body.rotation.y=0;o.head.rotation.x=0;o.head.rotation.z=0;
  } else {
    o.g.rotation.z+=(0-o.g.rotation.z)*.2; // Levantar
    if(e.dn){const s=k*7;o.g.position.set(e.x,o.h+Math.abs(Math.sin(s))*.18,e.y);o.armL.rotation.x=-2.5+Math.sin(s)*.6;o.armR.rotation.x=holding?-1.4+Math.sin(s)*.2:-2.5-Math.sin(s)*.6;o.armL.rotation.z=-.25;o.armR.rotation.z=.25;
     o.legL.rotation.x=Math.sin(s)*.5;o.legR.rotation.x=-Math.sin(s)*.5;o.body.rotation.y=Math.sin(k*3.5)*.45;o.head.rotation.z=Math.sin(k*3.5)*.2;o.head.rotation.x=0}
    else{o.g.position.set(e.x,o.h,e.y);const a=e.mv?Math.sin(w)*.8:0;
     if(making){o.armL.rotation.x=-1.5+Math.sin(k*14)*.5;o.armR.rotation.x=-1.5-Math.sin(k*14)*.5}
     else{o.armL.rotation.x+=((-a)-o.armL.rotation.x)*.3;const rT=drinking?-2.5:(holding?-1.2:a);o.armR.rotation.x+=(rT-o.armR.rotation.x)*.3}
     o.armL.rotation.z*=.7;o.armR.rotation.z*=.7;
     o.legL.rotation.x+=(a-o.legL.rotation.x)*.3;o.legR.rotation.x+=((-a)-o.legR.rotation.x)*.3;o.body.rotation.y*=.7;o.head.rotation.z*=.7;o.head.rotation.x+=((drinking?-.3:0)-o.head.rotation.x)*.3}
  }
  
  const far=e.dist>17;
  if(far){o.tag.style.display='none';o.bub.style.display='none';o.fx.style.display='none';continue}
  o.tag.style.display='block';put(o.tag,scr(e.x,o.h+(fallen?0:e.y),e.y+.2),'-50%,4px'); // ajuste mínimo na tag
  if(e.q.sa&&t-e.tSay<6000){const sy=String(e.q.say||'').slice(0,80);if(o.bt!==sy){o.bt=sy;o.bub.textContent=sy}o.bub.style.display='block';put(o.bub,scr(e.x,o.h+2.3,e.y),'-50%,-100%')}else o.bub.style.display='none';
  let ft=e.fxT,fp=e.fxP;
  if(fallen){ft='💤';fp=[e.x,o.h+1.2,e.y]}
  else if(!ft&&making){ft='🍸';fp=[e.x,o.h+2.5+Math.abs(Math.sin(k*10))*.2,e.y]}
  else if(!ft&&e.dn){ft='🎶';fp=[e.x,o.h+2.5+Math.abs(Math.sin(k*4))*.2,e.y]}
  
  if(ft){if(o.ft!==ft){o.ft=ft;o.fx.textContent=ft}o.fx.className=e.big?'fxi big':'fxi';o.fx.style.display='block';o.fx.style.opacity=e.fxA>.75?Math.max(0,1-(e.fxA-.75)*4):1;put(o.fx,scr(fp[0],fp[1],fp[2]),'-50%,-100%')}else o.fx.style.display='none'}
 for(const id in GL.ents)if(!alive[id]){dropEnt(GL.ents[id]);delete GL.ents[id]}
 GL.ren.render(GL.sc,GL.cam)}
